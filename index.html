<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Number Knight">
<meta name="theme-color" content="#151833">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head><body>
<title>Number Knight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: one-screen tablet game. Night-sky platformer chrome around a cream "paper" work surface;
   keypad column on the right in landscape, below the paper in portrait. Single committed look. */
:root{
  --night:#151833; --night-2:#1f2347; --night-3:#2c3264; --night-4:#3a4180;
  --paper:#fffaf0; --paper-2:#f3ecdc; --grid:#e6e9f3; --ink:#1f2340; --ink-soft:#5d6385;
  --gold:#ffc933; --gold-deep:#b98200; --grass:#3fbf5f; --grass-deep:#1f7a39;
  --brick:#e8643a; --sky:#8fd3ff; --red:#ff5d6c; --red-deep:#c7283a; --blue:#4d9bff; --violet:#9b6bff;
  --text:#f5f3ff; --text-soft:#b9bee6;
  --f-display:"Pixelify Sans","Lexend",system-ui,sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--text);font-family:var(--f-body);font-size:18px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,.field:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.5px;text-wrap:balance;margin:0}

/* ---------- shared bits */
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:19px;color:var(--ink);
  background:var(--paper);box-shadow:0 5px 0 #0007;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0007}
.btn-green{background:var(--grass);color:#08240f}
.btn-gold{background:var(--gold);color:#3a2700}
.btn-blue{background:var(--blue);color:#06183a}
.btn-dark{background:var(--night-3);color:var(--text)}
.btn-red{background:var(--red);color:#3a0710}
.btn small{display:block;font-size:13px;font-weight:600;opacity:.8}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--night-3);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.coin-ico{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0 0 25%,var(--gold) 26% 70%,var(--gold-deep) 71%);box-shadow:0 0 0 2px #0004}
.flame{width:14px;height:18px;background:linear-gradient(#ffe066,#ff7b1c);clip-path:polygon(50% 0,85% 45%,100% 75%,70% 100%,30% 100%,0 75%,15% 45%)}
.icon-btn{border:0;background:var(--night-3);color:var(--text);border-radius:12px;min-width:48px;height:48px;font-size:18px;font-weight:700;padding:0 12px;box-shadow:0 4px 0 #0007}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}

/* ---------- onboarding */
#scr-onboard{align-items:center;justify-content:center;justify-content:safe center;overflow:auto;padding:24px 16px;background:
  radial-gradient(ellipse at 50% 120%,#2d6a3e 0 30%,transparent 31%),linear-gradient(#10132b,#252b5c)}
.ob{width:min(640px,100%);display:grid;gap:18px;background:var(--night-2);border-radius:22px;padding:24px;box-shadow:0 8px 0 #0008}
.ob h1{font-size:40px;color:var(--gold)}
.ob p{margin:0;color:var(--text-soft);line-height:1.5}
.ob-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ob label{font-weight:700;font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-soft)}
.ob input{font:600 24px var(--f-body);padding:12px 14px;border-radius:12px;border:3px solid var(--night-4);background:var(--paper);color:var(--ink);width:100%}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:12px;border:3px solid transparent;box-shadow:0 3px 0 #0007}
.sw.on{border-color:var(--gold)}
.ob canvas{background:var(--night-3);border-radius:16px;image-rendering:pixelated}

/* ---------- map */
#scr-map{background:linear-gradient(#10132b,#1b2048 60%,#1f2a3f)}
.map-top{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.map-top .who{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.map-top .who h1{font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-top canvas{width:72px;height:72px;image-rendering:pixelated;background:var(--night-3);border-radius:14px}
.map-body{flex:1;min-height:0;padding:4px 16px 20px;display:grid;gap:16px;align-content:start}
.hq{background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 16px;line-height:1.45;display:flex;gap:12px;align-items:flex-start}
.hq b{font-family:var(--f-display);color:var(--brick);white-space:nowrap}
.quest{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:left;
  background:linear-gradient(135deg,#ffcf47,#ff9f1c);color:#3a2000;border:0;border-radius:18px;padding:16px 20px;box-shadow:0 6px 0 #8a4b00}
.quest:active{transform:translateY(4px);box-shadow:0 2px 0 #8a4b00}
.quest h2{font-size:28px}
.quest p{margin:4px 0 0;font-weight:600}
.pips{display:flex;gap:8px}
.pip{min-width:92px;padding:8px 10px;border-radius:10px;background:#fff6;font-weight:700;font-size:14px;text-align:center}
.pip.done{background:#2f9e4f;color:#fff}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.world{background:var(--night-2);border-radius:18px;padding:14px 16px 16px;display:grid;gap:10px;border-top:6px solid var(--wc)}
.world h3{font-size:24px;color:var(--wc)}
.world .sub{font-size:14px;color:var(--text-soft)}
.nodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.4fr);gap:8px;align-items:end}
.node{width:100%;height:56px;border:0;border-radius:12px;background:var(--night-3);color:var(--text);font:700 20px var(--f-display);
  display:grid;place-items:center;box-shadow:0 4px 0 #0008;position:relative;padding:0}
.node .st{position:absolute;bottom:-2px;left:0;right:0;font-size:11px;color:var(--gold);letter-spacing:-1px}
.node.open{background:var(--wc);color:#111;animation:bob 1.6s ease-in-out infinite}
.node.open .st{color:#111;font-weight:700}
.node.done{background:var(--night-4)}
.node.locked{opacity:.35;pointer-events:none}
.node.boss{font-size:16px}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- shop */
#scr-shop{background:var(--night)}
.shop-body{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding:8px 16px 16px}
.shop-prev{background:var(--night-2);border-radius:18px;padding:16px;display:grid;gap:10px;align-content:start;justify-items:center}
.shop-prev canvas{width:200px;height:200px;image-rendering:pixelated;background:var(--night-3);border-radius:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:0;border-radius:999px;padding:10px 18px;min-height:46px;font-weight:700;background:var(--night-3);color:var(--text)}
.tab.on{background:var(--gold);color:#3a2700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{border:0;border-radius:16px;background:var(--night-2);color:var(--text);padding:12px;display:grid;gap:6px;justify-items:center;box-shadow:0 4px 0 #0008}
.item canvas{width:96px;height:96px;image-rendering:pixelated}
.item .nm{font-weight:700}
.item .pr{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--gold)}
.item.eq{outline:3px solid var(--grass)}
.item.cant{opacity:.55}

/* ---------- level */
#scr-level{display:grid;grid-template-rows:auto clamp(96px,15.5vh,136px) minmax(0,1fr)}
.lv-top{display:flex;align-items:center;gap:12px;padding:8px 16px;min-width:0}
.lv-top h2{font-size:22px;flex:1;min-width:0;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prog{display:flex;gap:4px;flex-wrap:wrap;max-width:40%}
.prog i{width:12px;height:12px;border-radius:3px;background:var(--night-4)}
.prog i.ok{background:var(--grass)}.prog i.meh{background:var(--gold)}.prog i.miss{background:var(--red)}.prog i.now{background:var(--paper)}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:12px 16px 16px;min-height:0}
.left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 18px;overflow:auto;flex:0 1 auto;min-height:0;box-shadow:0 4px 0 #0006;scroll-behavior:smooth}
.scratch-wrap{position:relative;flex:1 0 200px;background:var(--paper);border-radius:16px;overflow:hidden;box-shadow:0 4px 0 #0006}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sc-tools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.sc-tools button{border:0;border-radius:10px;height:40px;min-width:44px;padding:0 10px;font-weight:700;font-size:14px;background:#e9e3d2;color:var(--ink)}
.sc-tools button.on{background:var(--ink);color:var(--paper)}
.sc-pages{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;align-items:center}
.sc-pages button{border:0;border-radius:10px;height:44px;min-width:46px;padding:0 12px;font-weight:700;font-size:15px;background:#e9e3d2;color:var(--ink)}
.sc-pages #sc-add{background:var(--ink);color:var(--paper)}
.sc-pages span{font:700 14px var(--f-body);color:var(--ink-soft);min-width:34px;text-align:center}
#scr-level.bigpaper{grid-template-rows:auto 64px minmax(0,1fr)}
.sc-label{position:absolute;left:12px;bottom:8px;font-size:13px;color:#a5a9c0;pointer-events:none}
.padcol{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:clamp(44px,7.4vh,60px);font:800 28px var(--f-math);background:var(--night-3);color:var(--text);border:0;border-radius:12px;box-shadow:0 4px 0 #0008}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #0008}
.key.wide{font:700 17px var(--f-body)}
.keypad.off{opacity:.35;pointer-events:none}
#msg{min-height:52px;font-size:16px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--night-2);color:var(--text-soft)}
#msg.good{background:#1d4d2c;color:#d8ffe2}#msg.warn{background:#5a2330;color:#ffe1e5}#msg.info{background:var(--night-3);color:var(--text)}
#actions{display:flex;flex-direction:column;gap:8px}
#actions .row{display:flex;gap:8px}#actions .row .btn{flex:1}

/* card content */
.tag{display:inline-block;font:700 12px var(--f-body);letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft);background:var(--paper-2);border-radius:6px;padding:3px 8px}
.prompt{font-size:20px;line-height:1.5;margin:8px 0 6px}
.expr{font:800 34px var(--f-math);letter-spacing:-.5px;margin:6px 0;color:var(--ink)}
.ans-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-weight:600}
.field{font:800 28px var(--f-math);min-width:150px;min-height:52px;padding:4px 12px;border:3px dashed #aab0c8;border-radius:12px;background:#fff;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.field.sm{min-width:96px;font-size:22px;min-height:44px}
.field.empty{color:#c0c4d6}
.field.active{border:3px solid var(--blue);box-shadow:0 0 0 4px #4d9bff40}
.field.wrong{border:3px solid var(--red);background:#fff0f2;animation:shake .3s}
.field.right{border:3px solid var(--grass);background:#ecffef}
.field.locked{pointer-events:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tip{font-size:15px;color:var(--ink-soft);margin-top:6px}
.checkbox{margin-top:12px;border-top:2px dashed #d8d2c0;padding-top:10px;display:grid;gap:8px}
.checkbox h4{margin:0;font:700 18px var(--f-display);color:var(--gold-deep)}
.checkbox .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:700 22px var(--f-math)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{border:0;border-radius:12px;padding:10px 16px;font:700 20px var(--f-math);background:var(--paper-2);color:var(--ink);box-shadow:0 3px 0 #0003}
.choice.yes{background:#d6f5de}.choice.no{background:#ffdfe3}
.choice.picked{outline:3px solid var(--blue)}
.verdict{font-weight:700}.verdict.ok{color:var(--grass-deep)}.verdict.bad{color:var(--red-deep)}

/* stacked arithmetic (reveal) */
.stack{display:inline-grid;font:800 30px var(--f-math);row-gap:2px;margin:6px 0}
.stack .c{text-align:center;position:relative;white-space:nowrap}
.stack .mk{font-size:15px;color:var(--red-deep);height:18px;line-height:18px}
.stack .ghost{color:#b8bccd}
.stack .bad{color:var(--red-deep);background:#ffe3e7;border-radius:4px}
.stack .good{color:var(--grass-deep)}
.stack .cm::after{content:",";position:absolute;right:-.2em;bottom:-.05em;font-size:.8em}
.stack .dt::after{content:".";position:absolute;right:-.22em;bottom:0}
.stack .rule{border-top:3px solid var(--ink);height:0;grid-column:1/-1}
.reveal{background:#eef6ff;border-radius:12px;padding:10px 14px;margin-top:10px}
.reveal h4{margin:0 0 4px;font:700 18px var(--f-display);color:#2459a6}
.reveal .lbl{font-size:13px;color:var(--ink-soft)}

/* word problems */
.story{font-size:21px;line-height:1.65;margin:6px 0}
.story .sent{border-radius:6px;padding:1px 2px}
.story .sent.tappable{background:#f2ecd9;cursor:pointer;box-shadow:inset 0 -2px 0 #d9cfae}
.story .sent.picked-q{background:#ffe9a8;box-shadow:inset 0 -3px 0 var(--gold)}
.story .sent.nope{background:#ffd6dc}
.story .num{font-family:var(--f-math);font-weight:800;padding:0 3px;border-radius:6px}
.story .num.tappable{background:#e3ecff;box-shadow:inset 0 -2px 0 #9fb7ec;cursor:pointer}
.story .num.sel{background:var(--blue);color:#fff}
.story .num.decoy-shown{text-decoration:line-through;color:#9aa0b8}
.plans{display:grid;gap:8px;margin-top:8px}
.plan{border:0;text-align:left;border-radius:12px;padding:10px 14px;background:var(--paper-2);color:var(--ink);font:600 17px var(--f-body);box-shadow:0 3px 0 #0003;line-height:1.5}
.plan b{font-family:var(--f-math)}
.plan.nope{background:#ffd6dc}.plan.yes{background:#d6f5de}
.steps{display:grid;gap:10px;margin-top:10px}
.steprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 22px var(--f-math)}
.steprow .lb{font:700 15px var(--f-body);color:var(--ink-soft);min-width:58px}
.statement{margin-top:10px;font-size:19px;background:#fff6d6;border-radius:10px;padding:8px 12px}
.strips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:8px}
.strip{border:0;border-radius:12px;background:var(--paper-2);padding:8px;box-shadow:0 3px 0 #0003}
.strip svg{width:100%;height:auto;display:block}
.strip.nope{background:#ffd6dc}.strip.yes{background:#d6f5de}

/* area model */
.area{display:inline-grid;gap:6px;margin-top:8px;align-items:center}
.area .hdr{font:800 22px var(--f-math);text-align:center;color:var(--ink-soft)}
.area .cell{background:#e9f1ff;border-radius:10px;min-height:70px;display:grid;place-items:center;padding:6px}
.area .cell:nth-child(odd){background:#f0e9ff}
.partials{margin-top:10px;font:700 22px var(--f-math);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* table */
table.dt{border-collapse:collapse;margin:8px 0;font:inherit;font-size:18px;color:var(--ink)}
table.dt th,table.dt td{border:2px solid #cfc6ad;padding:6px 14px;text-align:left}
table.dt td.n{text-align:right;font-family:var(--f-math);font-weight:800}
table.dt th{background:var(--paper-2)}
.stmts{display:grid;gap:8px;margin-top:8px}
.stmt{border:0;text-align:left;border-radius:12px;padding:10px 14px;background:var(--paper-2);color:var(--ink);font:500 18px var(--f-body);box-shadow:0 3px 0 #0003;line-height:1.45}
.stmt b{font-family:var(--f-display);margin-right:6px}
.stmt.nope{background:#ffd6dc}.stmt.yes{background:#d6f5de}

/* bug hunt */
.glitch{display:flex;gap:12px;align-items:center}
.glitch canvas{width:64px;height:64px;image-rendering:pixelated;flex:none}
.bubble{background:#e6fbff;border-radius:14px;padding:10px 14px;font-size:18px;line-height:1.4;position:relative}
.gwork{font:700 20px var(--f-math);background:#f3f0ff;border-radius:10px;padding:8px 12px;margin-top:8px;line-height:1.6}

/* overlay */
#overlay{position:absolute;inset:0;background:#0b0d1fcc;display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--night-2);border-radius:22px;padding:22px;width:min(560px,100%);display:grid;gap:14px;box-shadow:0 8px 0 #0009;max-height:100%;overflow:auto}
.modal h2{font-size:32px;color:var(--gold)}
.modal p{margin:0;color:var(--text-soft);line-height:1.5}
.modal .btns{display:flex;gap:10px;flex-wrap:wrap}
.modal .btns .btn{flex:1}
.stars{font-size:46px;letter-spacing:6px;color:var(--gold);font-family:var(--f-display)}
.stars .off{color:var(--night-4)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--night-3);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 26px var(--f-display);color:var(--text)}
.stat span{font-size:13px;color:var(--text-soft)}
.faces{display:flex;gap:10px;flex-wrap:wrap}
.faces .btn{flex:1;min-width:110px}
.howto{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.howto li{background:var(--night-3);border-radius:12px;padding:10px 14px;line-height:1.45}
.howto b{color:var(--gold)}

/* landscape: text-heavy problems sit beside the scratch paper so nothing scrolls away */
@media (min-aspect-ratio: 1/1) and (min-width: 1000px){
  .left.split{flex-direction:row}
  .left.split .card{flex:1 1 56%;min-width:0}
  .left.split .scratch-wrap{flex:1 1 44%;min-width:300px}
}
/* portrait / narrow */
@media (max-aspect-ratio: 1/1){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .padcol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .key{height:clamp(44px,4.6vh,54px);font-size:24px}
  .padcol #msg{grid-column:2;grid-row:1}
  .padcol .keypad{grid-column:1;grid-row:1/3}
  .padcol #actions{grid-column:2;grid-row:2}
  .padcol.nokeys{grid-template-columns:minmax(0,1fr)}
  .padcol.nokeys .keypad{display:none}
  .padcol.nokeys #msg,.padcol.nokeys #actions{grid-column:1;grid-row:auto}
  .padcol.nokeys #msg{min-height:0}
  .shop-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .shop-prev{grid-template-columns:auto 1fr;justify-items:start;align-items:center}
  .shop-prev canvas{width:120px;height:120px}
}
@media (max-width:560px){
  .worlds{grid-template-columns:minmax(0,1fr)}
  .work{overflow:auto;align-content:start;grid-template-rows:auto auto}
  .prog{display:none}
  .left{min-height:auto}

      for(let k=j+1;k<i;k++){cur[k]=9;mark[k]=9;}cur[i]+=10;mark[i]=cur[i];}}
  return{A,B,cur,mark,regroups};}
function addCarries(nums){const L=Math.max(...nums.map(x=>String(x).length));const ds=nums.map(x=>String(x).padStart(L,'0').split('').map(Number));
  const carry=Array(L+1).fill(0);let c=0,count=0;for(let i=L-1;i>=0;i--){const s=ds.reduce((t,d)=>t+d[i],0)+c;c=Math.floor(s/10);if(c){carry[i]=c;count++;}}

  let s='';for(let i=0;i<n;i++)s+=ds.reduce((t,d)=>t+d[i],0)%10;return Number(s);}

  const ints=p.nums.map(s=>Number(String(s).replace('.','')));const dp=Math.max(...p.nums.map(dpOf));
  const v=p.op==='−'?ints[0]-ints[1]:ints.reduce((a,b)=>a+b,0);return v/Math.pow(10,dp);}

  const i=s.length>=5?rint(0,Math.max(0,s.length-4)):rint(0,s.length-2);const d=Number(s[i]);s[i]=String(d===9?8:d===0?1:d+pick([-1,1]));if(i===0&&s[0]==='0')s[0]='1';

  S.push({t:'sum',val:v[k]+v[l],txt:x=>`${c.who} had ${fmt(x)} ${c.thing} on ${nm[k]} and ${nm[l]} combined.`});
  S.push({t:'total',val:v.reduce((a,b)=>a+b,0),txt:x=>`${c.who} had a total of ${fmt(x)} ${c.thing} for all four.`});
  const s1=v[i]+v[j],s2=v[k]+v[l];const big=s1>s2?[i,j]:[k,l],small=s1>s2?[k,l]:[i,j];
  S.push({t:'cmp',val:Math.abs(s1-s2),txt:(x,flip)=>{const A=flip?small:big,B=flip?big:small;return `${c.who} had ${fmt(x)} more ${c.thing} on ${nm[A[0]]} and ${nm[A[1]]} than on ${nm[B[0]]} and ${nm[B[1]]}.`;}});
  const order=shuffle(S);const f=rint(0,3);
  const stmts=order.map((s,idx)=>{if(idx!==f)return{text:s.txt(s.val),ok:true,why:s};
    if(s.t==='cmp'&&Math.random()<0.5)return{text:s.txt(s.val,true),ok:false,why:s,flip:true};
    let w;do{w=s.val+pick([-1,1])*pick([10,100,1000]);}while(w<=0);return{text:s.txt(w),ok:false,why:s,wrong:w};});
  return{kind:'table',skill:'table',title:c.title,head:c.head,names:nm,vals:v,stmts,answer:f,L};}

/* ---------- Bug Hunt (Glitch the robot makes mistakes) */
function genBug(baseTok,r){const base=makeProblem(baseTok||'sub');let glitch=base.answer,isBug=true,bugType='none',gparts=null;
  if(Math.random()<0.25){isBug=false;}
  else{const c=base.answer,cands=[];
    if(base.kind==='arith'){const dp=base.dp,ints=base.nums.map(s=>toInt(s,dp)),P=Math.pow(10,dp);
      if(base.op==='−'){cands.push(['noRegroup',noRegroupSub(ints[0],ints[1])/P],['forgotDecrement',noDecSub(ints[0],ints[1])/P]);}
      else cands.push(['noCarry',noCarryAdd(ints)/P]);
      if(dp>0&&base.nums.length===2)cands.push(['decimalMisaligned',rightAligned(base)]);
      cands.push(['digitSlip',digitSlip(c,dp)]);}
    else if(base.kind==='area'){const parts=allPartials(base);gparts=parts.slice();
      if(Math.random()<0.5&&parts.length>1){const i=rint(0,parts.length-1);gparts.splice(i,1);cands.push(['missingPartial',c-parts[i]]);}
      else{const big=parts.map((x,i)=>[x,i]).filter(x=>x[0]>=100);const q=big.length?pick(big):[parts[0],0];gparts[q[1]]=q[0]/10;cands.push(['placeValuePartial',c-q[0]+q[0]/10]);}}
    else if(base.kind==='word'){base.wrongPlans.forEach(w=>cands.push(['plan:'+w.kind,w.res,w]));}
    const ok=cands.filter(x=>x[1]>0&&isFinite(x[1])&&!eqNum(x[1],c));
    if(ok.length){const ch=pick(ok);glitch=fix2(ch[1]);bugType=ch[0];if(ch[2])base.glitchPlan=ch[2];}else isBug=false;}
  if(!isBug&&base.kind==='area')gparts=allPartials(base);
  return{kind:'bug',skill:'bug',base,glitch,isBug,bugType,gparts,answer:base.answer,L:base.L};}

const GEN={add:genAdd,sub:genSub,dec_add:genDecAdd,dec_sub:genDecSub,word:genWord,table:genTable};
function makeProblem(tok,boost){boost=boost||0;const [k,arg]=String(tok).split(':');
  if(k==='bug')return genBug(arg||'sub');
  if(k==='fact')return genFact(arg);
  if(k==='area')return genArea(R('area')+boost,arg);
  const g=GEN[k]||genSub;return g(R(k)+boost);}

/* ---------- homework packs written by the coach */
function parseText(lines){return lines.map(line=>{const segs=[];const re=/\[(~?)(\$?)([0-9.]+)\]/g;let last=0,m;
    while((m=re.exec(line))){if(m.index>last)segs.push(line.slice(last,m.index));segs.push(N(m[3],m[1]?'decoy':'need',m[2]?'$':''));last=re.lastIndex;}
    if(last<line.length)segs.push(line.slice(last));return segs;});}
function packProblem(it){try{
  if(it.type==='sub'||it.type==='add'||it.type==='dec'){const op=it.op||(it.type==='sub'?'−':'+');const nums=(it.nums||[it.a,it.b]).map(String);const dp=Math.max(...nums.map(dpOf));
    const skill=it.type==='dec'?(op==='−'?'dec_sub':'dec_add'):it.type;const p=mkArith(skill,op==='-'?'−':op,nums,dp,3);if(it.stacked!=null)p.stacked=!!it.stacked;return p;}
  if(it.type==='mult'){const a=Number(it.a),b=Number(it.b);const two=String(b).length>1&&String(a).length>1;
    return{kind:'area',skill:'area',a,b,top:decompose(a),side:decompose(b),mode:two?'2x2':(String(a).length>2?'bigx1':'1x'),answer:a*b,fillDecomp:!!it.fillDecomp,L:3};}
  if(it.type==='fact')return{kind:'fact',skill:'fact',a:it.a,b:it.b,key:Math.min(it.a,it.b)+'x'+Math.max(it.a,it.b),answer:it.a*it.b,L:1};
  if(it.type==='word'){const p={kind:'word',skill:'word',sentences:parseText(it.text),unit:it.unit||'',statement:it.statement||'The answer is ___.',L:3,
      steps:it.steps.map(s=>({op:s.op==='-'?'−':s.op==='x'||s.op==='*'?'×':s.op,a:typeof s.a==='string'&&s.a[0]==='$'?{ref:Number(s.a.slice(1))-1}:{v:Number(s.a)},
        b:typeof s.b==='string'&&s.b[0]==='$'?{ref:Number(s.b.slice(1))-1}:{v:Number(s.b)}})),strip:it.strip||null};return wordFinish(p);}
  if(it.type==='bug'){const b=genBug(it.base||'sub');if(it.glitch!=null){b.glitch=Number(it.glitch);b.isBug=!eqNum(b.glitch,b.answer);}return b;}
  if(it.type==='table')return genTable(3);

// stacked layout of an arithmetic problem on the grid paper
function stackLayout(p,extra){const dp=p.dp||0;const rows=p.nums.map(s=>digitsStr(s,dp));const ghost=p.nums.map(s=>dpOf(s)<dp?dp-dpOf(s):0);
  const extras=(extra||[]).map(x=>x==null?null:digitsStr(String(x),dp));
  const W=Math.max(...rows.map(r=>r.length),...extras.filter(Boolean).map(r=>r.length));return{rows,ghost,W,dp,extras};}
function drawStackOnGrid(p,glitchAns){return (c,W,H,g)=>{const lay=stackLayout(p,glitchAns!=null?[glitchAns]:[]);const cols=lay.W+1;
  const x0=g*1,y0=g;c.textAlign='center';c.textBaseline='middle';
  const drawNum=(str,row,color,ghostN)=>{const off=cols-str.length;for(let i=0;i<str.length;i++){const cx=x0+(off+i)*g+g/2,cy=y0+row*g+g/2;

  const tier=pr=>pr<=60?'common':pr<=150?'rare':pr<=250?'epic':'legendary';
  for(const cat of ['outfit','hat','cape','pet'])for(const it of CATALOG[cat])if(it.price>0&&tier(it.price)===rarity&&!state.owned.includes(cat+':'+it.id))opts.push({w:12,type:'gear',cat,id:it.id,name:it.name});
  const coins={common:25,rare:60,epic:120,legendary:300}[rarity];opts.push({w:opts.length?14:100,type:'coins',n:coins,name:coins+' coins'});
