<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Number Knight">
<meta name="theme-color" content="#151833">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head><body>
<title>Number Knight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: one-screen tablet game. Night-sky platformer chrome around a cream "paper" work surface;
   keypad column on the right in landscape, below the paper in portrait. Single committed look. */
:root{
  --night:#151833; --night-2:#1f2347; --night-3:#2c3264; --night-4:#3a4180;
  --paper:#fffaf0; --paper-2:#f3ecdc; --grid:#e6e9f3; --ink:#1f2340; --ink-soft:#5d6385;
  --gold:#ffc933; --gold-deep:#b98200; --grass:#3fbf5f; --grass-deep:#1f7a39;
  --brick:#e8643a; --sky:#8fd3ff; --red:#ff5d6c; --red-deep:#c7283a; --blue:#4d9bff; --violet:#9b6bff;
  --text:#f5f3ff; --text-soft:#b9bee6;
  --f-display:"Pixelify Sans","Lexend",system-ui,sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--text);font-family:var(--f-body);font-size:18px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,.field:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.5px;text-wrap:balance;margin:0}

/* ---------- shared bits */
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:19px;color:var(--ink);
  background:var(--paper);box-shadow:0 5px 0 #0007;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0007}
.btn-green{background:var(--grass);color:#08240f}
.btn-gold{background:var(--gold);color:#3a2700}
.btn-blue{background:var(--blue);color:#06183a}
.btn-dark{background:var(--night-3);color:var(--text)}
.btn-red{background:var(--red);color:#3a0710}
.btn small{display:block;font-size:13px;font-weight:600;opacity:.8}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--night-3);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.coin-ico{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0 0 25%,var(--gold) 26% 70%,var(--gold-deep) 71%);box-shadow:0 0 0 2px #0004}
.flame{width:14px;height:18px;background:linear-gradient(#ffe066,#ff7b1c);clip-path:polygon(50% 0,85% 45%,100% 75%,70% 100%,30% 100%,0 75%,15% 45%)}
.icon-btn{border:0;background:var(--night-3);color:var(--text);border-radius:12px;min-width:48px;height:48px;font-size:18px;font-weight:700;padding:0 12px;box-shadow:0 4px 0 #0007}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}

/* ---------- onboarding */
#scr-onboard{align-items:center;justify-content:center;justify-content:safe center;overflow:auto;padding:24px 16px;background:
  radial-gradient(ellipse at 50% 120%,#2d6a3e 0 30%,transparent 31%),linear-gradient(#10132b,#252b5c)}
.ob{width:min(640px,100%);display:grid;gap:18px;background:var(--night-2);border-radius:22px;padding:24px;box-shadow:0 8px 0 #0008}
.ob h1{font-size:40px;color:var(--gold)}
.ob p{margin:0;color:var(--text-soft);line-height:1.5}
.ob-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ob label{font-weight:700;font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-soft)}
.ob input{font:600 24px var(--f-body);padding:12px 14px;border-radius:12px;border:3px solid var(--night-4);background:var(--paper);color:var(--ink);width:100%}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:12px;border:3px solid transparent;box-shadow:0 3px 0 #0007}
.sw.on{border-color:var(--gold)}
.ob canvas{background:var(--night-3);border-radius:16px;image-rendering:pixelated}

/* ---------- map */
#scr-map{background:linear-gradient(#10132b,#1b2048 60%,#1f2a3f)}
.map-top{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.map-top .who{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.map-top .who h1{font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-top canvas{width:72px;height:72px;image-rendering:pixelated;background:var(--night-3);border-radius:14px}
.map-body{flex:1;min-height:0;padding:4px 16px 20px;display:grid;gap:16px;align-content:start}
.hq{background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 16px;line-height:1.45;display:flex;gap:12px;align-items:flex-start}
.hq b{font-family:var(--f-display);color:var(--brick);white-space:nowrap}
.quest{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:left;
  background:linear-gradient(135deg,#ffcf47,#ff9f1c);color:#3a2000;border:0;border-radius:18px;padding:16px 20px;box-shadow:0 6px 0 #8a4b00}
.quest:active{transform:translateY(4px);box-shadow:0 2px 0 #8a4b00}
.quest h2{font-size:28px}
.quest p{margin:4px 0 0;font-weight:600}
.pips{display:flex;gap:8px}
.pip{min-width:92px;padding:8px 10px;border-radius:10px;background:#fff6;font-weight:700;font-size:14px;text-align:center}
.pip.done{background:#2f9e4f;color:#fff}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.world{background:var(--night-2);border-radius:18px;padding:14px 16px 16px;display:grid;gap:10px;border-top:6px solid var(--wc)}
.world h3{font-size:24px;color:var(--wc)}
.world .sub{font-size:14px;color:var(--text-soft)}
.nodes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.4fr);gap:8px;align-items:end}
.node{width:100%;height:56px;border:0;border-radius:12px;background:var(--night-3);color:var(--text);font:700 20px var(--f-display);
  display:grid;place-items:center;box-shadow:0 4px 0 #0008;position:relative;padding:0}
.node .st{position:absolute;bottom:-2px;left:0;right:0;font-size:11px;color:var(--gold);letter-spacing:-1px}
.node.open{background:var(--wc);color:#111;animation:bob 1.6s ease-in-out infinite}
.node.open .st{color:#111;font-weight:700}
.node.done{background:var(--night-4)}
.node.locked{opacity:.35;pointer-events:none}
.node.boss{font-size:16px}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- shop */
#scr-shop{background:var(--night)}
.shop-body{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding:8px 16px 16px}
.shop-prev{background:var(--night-2);border-radius:18px;padding:16px;display:grid;gap:10px;align-content:start;justify-items:center}
.shop-prev canvas{width:200px;height:200px;image-rendering:pixelated;background:var(--night-3);border-radius:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:0;border-radius:999px;padding:10px 18px;min-height:46px;font-weight:700;background:var(--night-3);color:var(--text)}
.tab.on{background:var(--gold);color:#3a2700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{border:0;border-radius:16px;background:var(--night-2);color:var(--text);padding:12px;display:grid;gap:6px;justify-items:center;box-shadow:0 4px 0 #0008}
.item canvas{width:96px;height:96px;image-rendering:pixelated}
.item .nm{font-weight:700}
.item .pr{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--gold)}
.item.eq{outline:3px solid var(--grass)}
.item.cant{opacity:.55}

/* ---------- level */
#scr-level{display:grid;grid-template-rows:auto clamp(96px,15.5vh,136px) minmax(0,1fr)}
.lv-top{display:flex;align-items:center;gap:12px;padding:8px 16px;min-width:0}
.lv-top h2{font-size:22px;flex:1;min-width:0;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prog{display:flex;gap:4px;flex-wrap:wrap;max-width:40%}
.prog i{width:12px;height:12px;border-radius:3px;background:var(--night-4)}
.prog i.ok{background:var(--grass)}.prog i.meh{background:var(--gold)}.prog i.miss{background:var(--red)}.prog i.now{background:var(--paper)}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:12px 16px 16px;min-height:0}
.left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 18px;overflow:auto;flex:0 1 auto;min-height:0;box-shadow:0 4px 0 #0006;scroll-behavior:smooth}
.scratch-wrap{position:relative;flex:1 0 200px;background:var(--paper);border-radius:16px;overflow:hidden;box-shadow:0 4px 0 #0006}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sc-tools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.sc-tools button{border:0;border-radius:10px;height:40px;min-width:44px;padding:0 10px;font-weight:700;font-size:14px;background:#e9e3d2;color:var(--ink)}
.sc-tools button.on{background:var(--ink);color:var(--paper)}
.sc-pages{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;align-items:center}
.sc-pages button{border:0;border-radius:10px;height:44px;min-width:46px;padding:0 12px;font-weight:700;font-size:15px;background:#e9e3d2;color:var(--ink)}
.sc-pages #sc-add{background:var(--ink);color:var(--paper)}
.sc-pages span{font:700 14px var(--f-body);color:var(--ink-soft);min-width:34px;text-align:center}
#scr-level.bigpaper{grid-template-rows:auto 64px minmax(0,1fr)}
.sc-label{position:absolute;left:12px;bottom:8px;font-size:13px;color:#a5a9c0;pointer-events:none}
.padcol{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:clamp(44px,7.4vh,60px);font:800 28px var(--f-math);background:var(--night-3);color:var(--text);border:0;border-radius:12px;box-shadow:0 4px 0 #0008}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #0008}
.key.wide{font:700 17px var(--f-body)}
.keypad.off{opacity:.35;pointer-events:none}
#msg{min-height:52px;font-size:16px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--night-2);color:var(--text-soft)}
#msg.good{background:#1d4d2c;color:#d8ffe2}#msg.warn{background:#5a2330;color:#ffe1e5}#msg.info{background:var(--night-3);color:var(--text)}
#actions{display:flex;flex-direction:column;gap:8px}
#actions .row{display:flex;gap:8px}#actions .row .btn{flex:1}

/* card content */
.tag{display:inline-block;font:700 12px var(--f-body);letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft);background:var(--paper-2);border-radius:6px;padding:3px 8px}
.prompt{font-size:20px;line-height:1.5;margin:8px 0 6px}
.expr{font:800 34px var(--f-math);letter-spacing:-.5px;margin:6px 0;color:var(--ink)}
.ans-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-weight:600}
.field{font:800 28px var(--f-math);min-width:150px;min-height:52px;padding:4px 12px;border:3px dashed #aab0c8;border-radius:12px;background:#fff;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.field.sm{min-width:96px;font-size:22px;min-height:44px}
.field.empty{color:#c0c4d6}
.field.active{border:3px solid var(--blue);box-shadow:0 0 0 4px #4d9bff40}
.field.wrong{border:3px solid var(--red);background:#fff0f2;animation:shake .3s}
.field.right{border:3px solid var(--grass);background:#ecffef}
.field.locked{pointer-events:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tip{font-size:15px;color:var(--ink-soft);margin-top:6px}
.checkbox{margin-top:12px;border-top:2px dashed #d8d2c0;padding-top:10px;display:grid;gap:8px}
.checkbox h4{margin:0;font:700 18px var(--f-display);color:var(--gold-deep)}
.checkbox .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:700 22px var(--f-math)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{border:0;border-radius:12px;padding:10px 16px;font:700 20px var(--f-math);background:var(--paper-2);color:var(--ink);box-shadow:0 3px 0 #0003}
.choice.yes{background:#d6f5de}.choice.no{background:#ffdfe3}
.choice.picked{outline:3px solid var(--blue)}
.verdict{font-weight:700}.verdict.ok{color:var(--grass-deep)}.verdict.bad{color:var(--red-deep)}

/* stacked arithmetic (reveal) */
.stack{display:inline-grid;font:800 30px var(--f-math);row-gap:2px;margin:6px 0}
.stack .c{text-align:center;position:relative;white-space:nowrap}
.stack .mk{font-size:15px;color:var(--red-deep);height:18px;line-height:18px}
.stack .ghost{color:#b8bccd}
.stack .bad{color:var(--red-deep);background:#ffe3e7;border-radius:4px}
.stack .good{color:var(--grass-deep)}
.stack .cm::after{content:",";position:absolute;right:-.2em;bottom:-.05em;font-size:.8em}
.stack .dt::after{content:".";position:absolute;right:-.22em;bottom:0}
.stack .rule{border-top:3px solid var(--ink);height:0;grid-column:1/-1}
.reveal{background:#eef6ff;border-radius:12px;padding:10px 14px;margin-top:10px}
.reveal h4{margin:0 0 4px;font:700 18px var(--f-display);color:#2459a6}
.reveal .lbl{font-size:13px;color:var(--ink-soft)}

/* word problems */
.story{font-size:21px;line-height:1.65;margin:6px 0}
.story .sent{border-radius:6px;padding:1px 2px}
.story .sent.tappable{background:#f2ecd9;cursor:pointer;box-shadow:inset 0 -2px 0 #d9cfae}
.story .sent.picked-q{background:#ffe9a8;box-shadow:inset 0 -3px 0 var(--gold)}
.story .sent.nope{background:#ffd6dc}
.story .num{font-family:var(--f-math);font-weight:800;padding:0 3px;border-radius:6px}
.story .num.tappable{background:#e3ecff;box-shadow:inset 0 -2px 0 #9fb7ec;cursor:pointer}
.story .num.sel{background:var(--blue);color:#fff}
.story .num.decoy-shown{text-decoration:line-through;color:#9aa0b8}
.plans{display:grid;gap:8px;margin-top:8px}
.plan{border:0;text-align:left;border-radius:12px;padding:10px 14px;background:var(--paper-2);color:var(--ink);font:600 17px var(--f-body);box-shadow:0 3px 0 #0003;line-height:1.5}
.plan b{font-family:var(--f-math)}
.plan.nope{background:#ffd6dc}.plan.yes{background:#d6f5de}
.steps{display:grid;gap:10px;margin-top:10px}
.steprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 22px var(--f-math)}
.steprow .lb{font:700 15px var(--f-body);color:var(--ink-soft);min-width:58px}
.statement{margin-top:10px;font-size:19px;background:#fff6d6;border-radius:10px;padding:8px 12px}
.strips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:8px}
.strip{border:0;border-radius:12px;background:var(--paper-2);padding:8px;box-shadow:0 3px 0 #0003}
.strip svg{width:100%;height:auto;display:block}
.strip.nope{background:#ffd6dc}.strip.yes{background:#d6f5de}

/* area model */
.area{display:inline-grid;gap:6px;margin-top:8px;align-items:center}
.area .hdr{font:800 22px var(--f-math);text-align:center;color:var(--ink-soft)}
.area .cell{background:#e9f1ff;border-radius:10px;min-height:70px;display:grid;place-items:center;padding:6px}
.area .cell:nth-child(odd){background:#f0e9ff}
.partials{margin-top:10px;font:700 22px var(--f-math);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* table */
table.dt{border-collapse:collapse;margin:8px 0;font:inherit;font-size:18px;color:var(--ink)}
table.dt th,table.dt td{border:2px solid #cfc6ad;padding:6px 14px;text-align:left}
table.dt td.n{text-align:right;font-family:var(--f-math);font-weight:800}
table.dt th{background:var(--paper-2)}
.stmts{display:grid;gap:8px;margin-top:8px}
.stmt{border:0;text-align:left;border-radius:12px;padding:10px 14px;background:var(--paper-2);color:var(--ink);font:500 18px var(--f-body);box-shadow:0 3px 0 #0003;line-height:1.45}
.stmt b{font-family:var(--f-display);margin-right:6px}
.stmt.nope{background:#ffd6dc}.stmt.yes{background:#d6f5de}

/* bug hunt */
.glitch{display:flex;gap:12px;align-items:center}
.glitch canvas{width:64px;height:64px;image-rendering:pixelated;flex:none}
.bubble{background:#e6fbff;border-radius:14px;padding:10px 14px;font-size:18px;line-height:1.4;position:relative}
.gwork{font:700 20px var(--f-math);background:#f3f0ff;border-radius:10px;padding:8px 12px;margin-top:8px;line-height:1.6}

/* overlay */
#overlay{position:absolute;inset:0;background:#0b0d1fcc;display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--night-2);border-radius:22px;padding:22px;width:min(560px,100%);display:grid;gap:14px;box-shadow:0 8px 0 #0009;max-height:100%;overflow:auto}
.modal h2{font-size:32px;color:var(--gold)}
.modal p{margin:0;color:var(--text-soft);line-height:1.5}
.modal .btns{display:flex;gap:10px;flex-wrap:wrap}
.modal .btns .btn{flex:1}
.stars{font-size:46px;letter-spacing:6px;color:var(--gold);font-family:var(--f-display)}
.stars .off{color:var(--night-4)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--night-3);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 26px var(--f-display);color:var(--text)}
.stat span{font-size:13px;color:var(--text-soft)}
.faces{display:flex;gap:10px;flex-wrap:wrap}
.faces .btn{flex:1;min-width:110px}
.howto{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.howto li{background:var(--night-3);border-radius:12px;padding:10px 14px;line-height:1.45}
.howto b{color:var(--gold)}

/* landscape: text-heavy problems sit beside the scratch paper so nothing scrolls away */
@media (min-aspect-ratio: 1/1) and (min-width: 1000px){
  .left.split{flex-direction:row}
  .left.split .card{flex:1 1 56%;min-width:0}
  .left.split .scratch-wrap{flex:1 1 44%;min-width:300px}
}
/* portrait / narrow */
@media (max-aspect-ratio: 1/1){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .padcol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .key{height:clamp(44px,4.6vh,54px);font-size:24px}
  .padcol #msg{grid-column:2;grid-row:1}
  .padcol .keypad{grid-column:1;grid-row:1/3}
  .padcol #actions{grid-column:2;grid-row:2}
  .padcol.nokeys{grid-template-columns:minmax(0,1fr)}
  .padcol.nokeys .keypad{display:none}
  .padcol.nokeys #msg,.padcol.nokeys #actions{grid-column:1;grid-row:auto}
  .padcol.nokeys #msg{min-height:0}
  .shop-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .shop-prev{grid-template-columns:auto 1fr;justify-items:start;align-items:center}
  .shop-prev canvas{width:120px;height:120px}
}
@media (max-width:560px){
  .worlds{grid-template-columns:minmax(0,1fr)}
  .work{overflow:auto;align-content:start;grid-template-rows:auto auto}
  .prog{display:none}
  .left{min-height:auto}
  .card{flex:none;overflow:visible}

}
.sync{font-size:13px;color:var(--text-soft);text-align:center;padding:4px 0 8px}
.sync.on::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grass);margin-right:6px;vertical-align:1px}
.report table.rep{width:100%;border-collapse:collapse;font-size:15px}
.report table.rep th,.report table.rep td{border-bottom:1px solid var(--night-4);padding:6px 4px;text-align:left}

.rep-raw{width:100%;height:120px;font:12px var(--f-math);border-radius:8px}
.tiny-ok{color:var(--grass)!important;font-weight:700}
/* ---------- battle strip, cinematics, loot */
.scene-wrap{position:relative;min-height:0;overflow:hidden}
.superbtn{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:6px;z-index:2;border:0;border-radius:12px;padding:8px 20px;font:700 22px var(--f-display);color:#3a1a00;
  background:linear-gradient(135deg,#ffe066,#ff7b1c);box-shadow:0 0 0 3px #fff8,0 0 24px #ff7b1c;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08);box-shadow:0 0 0 3px #fff,0 0 40px #ffb627}}
#cine{position:absolute;inset:0;z-index:40;background:#000;touch-action:none}
#cine canvas{width:100%;height:100%;display:block}
#cine .skip{position:absolute;top:14px;right:14px;z-index:3;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:17px;background:#ffffff26;color:#fff}
.cine-ui{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.cine-ui>*{pointer-events:auto}
.cine-tap{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0}
.loot-card{background:#161a38f2;border:3px solid var(--rc);border-radius:22px;padding:20px 26px;display:grid;gap:8px;justify-items:center;box-shadow:0 0 60px var(--rc);
  animation:pop .35s ease-out;width:min(360px,100%);text-align:center}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.loot-r{font:700 28px var(--f-display);color:var(--rc);letter-spacing:2px}
.loot-n{font:700 24px var(--f-display);color:#fff}
.loot-d{color:var(--text-soft);font-size:15px;line-height:1.4}
.loot-ic{width:120px;height:120px;image-rendering:pixelated}
.loot-card .btn{width:100%;margin-top:6px}
.prizes{background:var(--night-3);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.prz{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prz .btn{padding:8px 14px;font-size:16px}
/* ---------- overworld */
#scr-map{background:#1e3a8a}
.ow{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ow-inner{position:relative}
.ow-art{position:absolute;left:0;top:0;image-rendering:pixelated}
.ow-node{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:3px solid #fff;background:var(--wc);color:#111;font:700 18px var(--f-body);
  box-shadow:0 4px 0 #0009;padding:0;z-index:2}
.ow-node.done{background:#ffc933}
.ow-node.open{animation:bob 1.4s ease-in-out infinite;box-shadow:0 0 0 5px #ffffff55,0 4px 0 #0009}
.ow-node.locked{background:#3a4180;color:#9aa0d0;border-color:#5a60a0}
.ow-node .st{position:absolute;top:48px;left:-16px;right:-16px;font:700 12px var(--f-body);color:#ffe066;text-shadow:0 1px 0 #000,0 0 3px #000;white-space:nowrap}
.ow-castle{position:absolute;background:transparent;border:0;padding:0;z-index:1}
.ow-label{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);white-space:nowrap;background:#0b0d1fdd;border:2px solid var(--wc);color:#fff;border-radius:10px;
  padding:4px 12px;font:700 16px var(--f-display);display:grid;line-height:1.2;pointer-events:none}
.ow-label small{font:600 12px var(--f-body);color:var(--text-soft)}
.ow-hero{position:absolute;width:48px;height:56px;image-rendering:pixelated;pointer-events:none;z-index:3;filter:drop-shadow(0 3px 0 #0006)}
.ow-flag{position:absolute;width:5px;height:46px;background:#e5e7eb;z-index:2;pointer-events:none}
.ow-flag::after{content:'';position:absolute;left:5px;top:0;width:34px;height:22px;background:var(--fc);animation:wave 1s ease-in-out infinite alternate;transform-origin:left}
@keyframes wave{to{transform:skewY(8deg) scaleX(.9)}}
.ow-cloud{position:absolute;left:-320px;width:220px;height:60px;border-radius:40px;background:#ffffff30;box-shadow:60px 10px 0 -6px #ffffff28,120px -6px 0 4px #ffffff22;
  animation:drift 60s linear infinite;pointer-events:none;z-index:2}
@keyframes drift{to{transform:translateX(2900px)}}
.ow-storm{position:absolute;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,#2e1065cc,#2e106500 70%);animation:storm 3.2s steps(1) infinite;z-index:2}
@keyframes storm{0%,100%{filter:none}46%{filter:brightness(2.6)}48%{filter:none}52%{filter:brightness(1.9)}}
.ow-hud{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px 28px;background:linear-gradient(#0b0d1ff2 55%,#0b0d1f00);pointer-events:none;z-index:5}
.ow-hud>*{pointer-events:auto}
.ow-av{width:60px;height:60px;image-rendering:pixelated;background:var(--night-3);border-radius:12px}
.ow-name{display:grid;flex:1;min-width:150px;line-height:1.2}
.ow-name b{font:700 24px var(--f-display)}.ow-name span{font-size:13px;color:var(--text-soft)}
.icon-btn.off{opacity:.5;text-decoration:line-through}
.ow-bottom{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:12px;align-items:flex-end;justify-content:space-between;pointer-events:none;z-index:5;flex-wrap:wrap}
.ow-bottom>*{pointer-events:auto}
.ow-quest{max-width:440px}
.ow-quest h2{font-size:24px}
.ow-side{display:grid;gap:8px;justify-items:end}
.ow-prize{background:#ffc933;color:#3a2700;font-weight:700;border-radius:12px;padding:8px 12px;animation:bob 1.2s ease-in-out infinite}
.ow-toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);background:#0b0d1fee;border:2px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:6;max-width:calc(100% - 32px)}
.kcard h2{color:var(--wc)}
.kcard .klevels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.klev{border:0;border-radius:14px;padding:12px;background:var(--night-3);color:var(--text);display:grid;gap:2px;text-align:left;box-shadow:0 4px 0 #0008;border-left:6px solid var(--wc)}
.klev b{font:700 18px var(--f-display)}.klev span{color:var(--gold);font-size:14px}
.klev.locked{opacity:.4}
.klev.boss{background:linear-gradient(135deg,#3b0764,#7e22ce);border-left-color:#ff4d6d}
/* ---------- mech bay */
#scr-mech{background:radial-gradient(ellipse at 30% 30%,#22285a,#0d1026)}
.bay{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;padding:8px 16px 16px}
.bay-left{background:var(--night-2);border-radius:18px;padding:16px;display:grid;gap:10px;align-content:start;justify-items:center}
.bay-left p{margin:0;color:var(--text-soft)}
.bay-cv{width:260px;height:260px;image-rendering:pixelated;border-radius:14px}
.bay-power{width:100%;display:grid;gap:4px}.bay-power b{font:700 22px var(--f-display);color:var(--gold)}
.bay-bar{height:12px;border-radius:6px;background:#0b0d1f;overflow:hidden}.bay-bar i{display:block;height:100%;background:linear-gradient(90deg,#5ef2ff,#ffc933)}
.bay-launch{width:100%;font-size:24px;padding:16px;animation:pulse .7s ease-in-out infinite alternate}
.bay-tip{font-size:14px;text-align:center}
.bay-right{min-height:0;overflow:auto}
.bay-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bay-it{border:0;border-radius:16px;background:var(--night-2);color:var(--text);padding:10px;display:grid;gap:4px;justify-items:center;box-shadow:0 4px 0 #0008;border-top:4px solid var(--rc)}
.bay-it canvas{width:90px;height:90px;image-rendering:pixelated}
.bay-it span{font-size:13px;color:var(--text-soft)}
.bay-it.eq{outline:3px solid var(--grass)}
.bay-it.lock{opacity:.5}
@media (max-aspect-ratio:1/1){.bay{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .bay-left{grid-template-columns:auto minmax(0,1fr);justify-items:start;align-items:center}.bay-cv{width:170px;height:170px;grid-row:span 4}}

@media (prefers-reduced-motion: reduce){ .node.open{animation:none} .field.wrong{animation:none} }
/* ---------- allies: RPG dialogue */
#talk{position:absolute;inset:0;z-index:30;background:linear-gradient(#0b0d1f00 30%,#0b0d1fcc);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:16px 16px max(16px,env(safe-area-inset-bottom));cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#talk[hidden]{display:none}
.talk-box{--nc:#5ef2ff;position:relative;width:min(760px,100%);display:flex;gap:16px;align-items:flex-start;background:#14183a;border:4px solid var(--nc);border-radius:18px;
  padding:16px 18px 18px;box-shadow:0 0 0 4px #0b0d1f,0 10px 0 #0008,0 0 30px color-mix(in srgb,var(--nc) 35%,transparent);animation:talkUp .28s cubic-bezier(.2,1.4,.5,1)}
.talk-pt{flex:none;width:108px;height:108px;border-radius:12px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--nc) 30%,#1d2250),#0e1130);border:3px solid var(--nc);image-rendering:pixelated}
.talk-body{flex:1;min-width:0}
.talk-name{font-family:var(--f-display);font-size:24px;color:var(--nc);line-height:1.1;margin-bottom:6px}
.talk-name small{display:block;font-family:var(--f-body);font-size:13px;color:#aab1d6;letter-spacing:.3px}
.talk-text{font-size:21px;line-height:1.4;color:#fff;min-height:3.6em;overflow-wrap:anywhere}
.talk-more{position:absolute;right:16px;bottom:8px;color:var(--nc);font-size:16px;animation:talkBob .7s steps(2) infinite}
.talk-more[hidden]{display:none}
.talk-skip{position:absolute;top:-46px;right:0;background:#0b0d1fcc;color:#cfd5ff;border:2px solid #3a4180;border-radius:12px;padding:8px 14px;font:600 15px var(--f-body);cursor:pointer}
.talk-new{font-family:var(--f-display);font-size:26px;color:#ffe066;text-shadow:0 3px 0 #b8860b,0 0 18px #ffe06699;margin-bottom:12px;letter-spacing:1px;animation:allyNew .9s cubic-bezier(.2,1.6,.4,1)}
.talk-new[hidden]{display:none}
@keyframes talkUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes talkBob{50%{transform:translateY(4px)}}
@keyframes allyNew{0%{transform:scale(.2) rotate(-8deg);opacity:0}60%{transform:scale(1.2) rotate(3deg);opacity:1}100%{transform:none}}
/* quick advice bubble */
.tpop{--nc:#5ef2ff;position:absolute;z-index:15;display:flex;gap:10px;align-items:center;background:#14183af2;border:3px solid var(--nc);border-radius:14px;padding:6px 12px 6px 6px;
  box-shadow:0 6px 0 #0008;cursor:pointer;min-width:min(300px,calc(100% - 16px))}
.tpop[hidden]{display:none}
.tpop.in{animation:popIn .32s cubic-bezier(.2,1.5,.5,1)}
.tpop canvas{flex:none;width:64px;height:64px;border-radius:10px;background:#0e1130;image-rendering:pixelated}
.tpop b{display:block;font-family:var(--f-display);color:var(--nc);font-size:16px;line-height:1.1}
.tpop span{display:block;font-size:16px;line-height:1.3;color:#fff}
@keyframes popIn{from{transform:translateX(-30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
/* allies book */
.allies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ally{--nc:#5ef2ff;display:grid;justify-items:center;gap:4px;background:#14183a;border:3px solid var(--nc);border-radius:14px;padding:10px 8px;color:#fff;cursor:pointer;font:inherit}
.ally canvas{width:72px;height:72px;image-rendering:pixelated}
.ally b{font-family:var(--f-display);font-size:17px;color:var(--nc)}
.ally span{font-size:12px;color:#aab1d6;text-align:center}
.ally.locked{border-color:#2b2f55;cursor:default}
.ally.locked b{color:#5d6385}
@media (max-width:600px){.talk-pt{width:76px;height:76px}.talk-text{font-size:18px}.talk-name{font-size:20px}.talk-box{gap:10px;padding:12px}}
@media (prefers-reduced-motion:reduce){.talk-box,.tpop.in,.talk-new,.talk-more{animation:none}}
@media (max-width:480px){.talk-new{align-self:flex-start;font-size:19px}.talk-skip{padding:6px 10px;font-size:13px;top:-40px}}
/* ---------- keys that answer the Pencil */
.key,#actions .btn,.field{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.key.hit{animation:keyHit .28s ease-out}
@keyframes keyHit{0%{background:#5ef2ff;color:#0b0d1f;transform:scale(.9)}100%{background:var(--night-3);color:var(--text);transform:none}}
#actions .btn.hit{animation:btnHit .25s ease-out}
@keyframes btnHit{0%{transform:scale(.94);filter:brightness(1.4)}100%{transform:none;filter:none}}
.field.bump{animation:fieldBump .18s ease-out}
@keyframes fieldBump{0%{transform:scale(1.08)}100%{transform:none}}
.field.right{position:relative}
.field.right::after{content:'✓';position:absolute;right:-34px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--grass);color:#fff;font:800 18px/28px var(--f-body);text-align:center}
/* ---------- result stamps */
.stamp{position:absolute;left:0;right:0;top:34%;display:flex;justify-content:center;pointer-events:none;z-index:18}
.stamp-in{position:relative;display:flex;align-items:center;gap:14px;background:var(--sc);color:#0b0d1f;border:6px solid #fff;border-radius:24px;padding:12px 30px 12px 16px;
  transform:rotate(-5deg);box-shadow:0 10px 0 #0009,0 0 70px var(--sc);animation:stampIn .4s cubic-bezier(.2,1.7,.4,1) both}
.stamp-in i{font-style:normal;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#fff;color:var(--sc);font:900 46px/1 var(--f-body);text-shadow:0 0 1px #0004}
.stamp-in b{font:800 54px/1 var(--f-display);letter-spacing:1px;color:#0b0d1f}
.stamp-in span{position:absolute;left:50%;bottom:-36px;transform:translateX(-50%);white-space:nowrap;background:#0b0d1f;color:#fff;font:700 18px var(--f-body);padding:4px 12px;border-radius:10px}
.stamp-in::before{content:'';position:absolute;inset:-60px;z-index:-1;background:conic-gradient(from 0deg,transparent 0 6%,color-mix(in srgb,var(--sc) 55%,transparent) 6% 9%,transparent 9% 19%,color-mix(in srgb,var(--sc) 55%,transparent) 19% 22%,transparent 22% 31%,color-mix(in srgb,var(--sc) 55%,transparent) 31% 34%,transparent 34% 44%,color-mix(in srgb,var(--sc) 55%,transparent) 44% 47%,transparent 47% 56%,color-mix(in srgb,var(--sc) 55%,transparent) 56% 59%,transparent 59% 69%,color-mix(in srgb,var(--sc) 55%,transparent) 69% 72%,transparent 72% 81%,color-mix(in srgb,var(--sc) 55%,transparent) 81% 84%,transparent 84%);
  border-radius:50%;animation:spin 3s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.stamp.soft .stamp-in{transform:none;border-width:4px;padding:8px 22px 8px 10px;box-shadow:0 6px 0 #0008}
.stamp.soft .stamp-in::before{display:none}
.stamp.soft .stamp-in b{font-size:36px}.stamp.soft .stamp-in i{width:44px;height:44px;font-size:30px}
.stamp.small{top:24%}.stamp.small .stamp-in{transform:rotate(-4deg) scale(.7)}
.stamp.small .stamp-in::before{display:none}
@keyframes stampIn{0%{transform:scale(2.6) rotate(-14deg);opacity:0}100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
#scr-level.glow-good::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:17;box-shadow:inset 0 0 0 6px #3fdc6b,inset 0 0 80px #3fdc6b99;animation:glowOut .9s ease-out forwards}

@keyframes glowOut{to{opacity:0}}
/* ---------- scratch grip */
.sc-grip{flex:none;height:22px;margin:-6px 0;display:grid;place-items:center;cursor:row-resize;touch-action:none;z-index:2}
.sc-grip span{width:160px;height:10px;border-radius:6px;background:var(--night-3);box-shadow:0 0 0 2px #ffffff22;position:relative}
.sc-grip span::before{content:'⇕ drag for more paper';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;font:700 10px var(--f-body);color:#aab1d6;letter-spacing:.3px}
.sc-grip.drag span,.sc-grip:hover span{background:var(--blue)}
.sc-grip.drag span::before{color:#fff}
.left.split .sc-grip{height:auto;width:22px;margin:0 -6px;cursor:col-resize}
.left.split .sc-grip span{width:10px;height:120px}
.left.split .sc-grip span::before{content:'⇔';font-size:12px}
@media (max-width:560px){.sc-grip{display:none}}
/* ---------- bigger battle between problems */
.scene-wrap{z-index:6;overflow:visible}
#scene{position:absolute;left:0;top:0;width:100%;height:100%;transition:height .35s cubic-bezier(.3,1.3,.5,1)}
.scene-wrap.big #scene{height:calc(100% + 30vh);box-shadow:0 12px 0 #0009;border-radius:0 0 18px 18px}
.scene-wrap .superbtn{z-index:7}
/* ---------- dojo */
#scr-dojo{overflow:auto;padding:0 16px 24px}
#scr-dojo .lv-top{position:sticky;top:0;z-index:3}
.dj-sensei{display:flex;gap:14px;align-items:center;background:#14183a;border:3px solid #ff8c2a;border-radius:16px;padding:10px 16px;margin:12px auto;max-width:980px}
.dj-sensei canvas{width:64px;height:64px;image-rendering:pixelated;border-radius:12px;background:#0e1130;flex:none}
.dj-sensei p{margin:0;font-size:18px;line-height:1.4}
.dj-panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:14px;max-width:980px;margin:0 auto}
.dj-panel{background:var(--night-2);border-radius:18px;padding:16px;border-top:8px solid var(--bc);display:grid;gap:12px;box-shadow:0 6px 0 #0007}
.dj-panel h3{margin:0;font:800 24px var(--f-display)}
.dj-ladder{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.dj-belt{display:grid;justify-items:center;gap:3px;font-size:11px;color:#ffe066;min-width:0}
.dj-belt i{display:block;width:100%;height:16px;border-radius:4px;background:var(--bc);box-shadow:inset 0 -4px 0 #0003,0 0 0 2px #0006;position:relative}
.dj-belt i::after{content:'';position:absolute;left:50%;top:-3px;width:8px;height:22px;margin-left:-4px;background:var(--bc);border-radius:2px;box-shadow:0 0 0 2px #0006}
.dj-belt.lock{opacity:.28}
.dj-belt.cur i{animation:beltPulse 1.4s ease-in-out infinite}
@keyframes beltPulse{50%{box-shadow:inset 0 -4px 0 #0003,0 0 0 3px #fff,0 0 16px var(--bc)}}
.dj-belt.got span{color:#3fdc6b;font-weight:800}
.dj-cur{margin:0;font-size:17px;line-height:1.35}.dj-cur small{color:var(--text-soft)}
.dj-today{display:flex;gap:16px;font-size:15px;color:var(--text-soft)}.dj-today .ok{color:#3fdc6b;font-weight:700}
.dj-btns{display:flex;flex-wrap:wrap;gap:8px}.dj-btns .btn{flex:1 1 160px}
.dj-go{animation:goPulse 1.6s ease-in-out infinite}
@keyframes goPulse{50%{box-shadow:0 4px 0 #0008,0 0 0 4px #3fdc6b66}}
.dj-cab{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;max-width:980px;margin:16px auto 0;color:var(--text-soft)}
.medal{--m:#cd7f32;display:inline-grid;justify-items:center;gap:2px}
.medal i{display:block;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,transparent 45%),var(--m);box-shadow:0 0 0 3px #0005,inset 0 -4px 0 #0003}
.medal b{font:800 18px var(--f-display);color:#fff}.medal small{font-size:11px}
.medal.diamond{--m:#7df9ff}.medal.gold{--m:#ffc933}.medal.silver{--m:#d7deeb}.medal.bronze{--m:#cd7f32}.medal.none{--m:#5d6385}
.medal.big i{width:110px;height:110px;animation:medalIn .7s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 6px #0005,inset 0 -10px 0 #0003,0 0 50px var(--m)}
.medal.big b{font-size:30px}
.medal.diamond.big i{background:conic-gradient(from 20deg,#7df9ff,#ffffff,#b388ff,#7df9ff,#ffffff,#7df9ff)}

function diagArith(p,v){const dp=p.dp||0,S=x=>Math.round(x*Math.pow(10,dp));const ans=S(v),c=S(p.answer),tags=[];

/* ---------- Bug Hunt (Glitch the robot makes mistakes) */
function genBug(baseTok,r){const base=makeProblem(baseTok||'sub');let glitch=base.answer,isBug=true,bugType='none',gparts=null;
  if(Math.random()<0.25){isBug=false;}
  else{const c=base.answer,cands=[];
    if(base.kind==='arith'){const dp=base.dp,ints=base.nums.map(s=>toInt(s,dp)),P=Math.pow(10,dp);
      if(base.op==='−'){cands.push(['noRegroup',noRegroupSub(ints[0],ints[1])/P],['forgotDecrement',noDecSub(ints[0],ints[1])/P]);}
      else cands.push(['noCarry',noCarryAdd(ints)/P]);
      if(dp>0&&base.nums.length===2)cands.push(['decimalMisaligned',rightAligned(base)]);
      cands.push(['digitSlip',digitSlip(c,dp)]);}
    else if(base.kind==='area'){const parts=allPartials(base);gparts=parts.slice();
      if(Math.random()<0.5&&parts.length>1){const i=rint(0,parts.length-1);gparts.splice(i,1);cands.push(['missingPartial',c-parts[i]]);}
      else{const big=parts.map((x,i)=>[x,i]).filter(x=>x[0]>=100);const q=big.length?pick(big):[parts[0],0];gparts[q[1]]=q[0]/10;cands.push(['placeValuePartial',c-q[0]+q[0]/10]);}}
    else if(base.kind==='word'){base.wrongPlans.forEach(w=>cands.push(['plan:'+w.kind,w.res,w]));}
    const ok=cands.filter(x=>x[1]>0&&isFinite(x[1])&&!eqNum(x[1],c));
    if(ok.length){const ch=pick(ok);glitch=fix2(ch[1]);bugType=ch[0];if(ch[2])base.glitchPlan=ch[2];}else isBug=false;}
  if(!isBug&&base.kind==='area')gparts=allPartials(base);
  return{kind:'bug',skill:'bug',base,glitch,isBug,bugType,gparts,answer:base.answer,L:base.L};}

function makeProblem(tok,boost){boost=boost||0;const [k,arg]=String(tok).split(':');
  if(k==='bug')return genBug(arg||'sub');
  if(k==='fact')return genFact(arg);

  const g=GEN[k]||genSub;return g(R(k)+boost);}

    while((m=re.exec(line))){if(m.index>last)segs.push(line.slice(last,m.index));segs.push(N(m[3],m[1]?'decoy':'need',m[2]?'$':''));last=re.lastIndex;}
    if(last<line.length)segs.push(line.slice(last));return segs;});}

  if(it.type==='mult'){const a=Number(it.a),b=Number(it.b);const two=String(b).length>1&&String(a).length>1;
    return{kind:'area',skill:'area',a,b,top:decompose(a),side:decompose(b),mode:two?'2x2':(String(a).length>2?'bigx1':'1x'),answer:a*b,fillDecomp:!!it.fillDecomp,L:3};}
  if(it.type==='fact')return{kind:'fact',skill:'fact',a:it.a,b:it.b,key:Math.min(it.a,it.b)+'x'+Math.max(it.a,it.b),answer:it.a*it.b,L:1};
  if(it.type==='word'){const p={kind:'word',skill:'word',sentences:parseText(it.text),unit:it.unit||'',statement:it.statement||'The answer is ___.',L:3,
      steps:it.steps.map(s=>({op:s.op==='-'?'−':s.op==='x'||s.op==='*'?'×':s.op,a:typeof s.a==='string'&&s.a[0]==='$'?{ref:Number(s.a.slice(1))-1}:{v:Number(s.a)},

// stacked layout of an arithmetic problem on the grid paper
function stackLayout(p,extra){const dp=p.dp||0;const rows=p.nums.map(s=>digitsStr(s,dp));const ghost=p.nums.map(s=>dpOf(s)<dp?dp-dpOf(s):0);
  const extras=(extra||[]).map(x=>x==null?null:digitsStr(String(x),dp));
  const W=Math.max(...rows.map(r=>r.length),...extras.filter(Boolean).map(r=>r.length));return{rows,ghost,W,dp,extras};}
function drawStackOnGrid(p,glitchAns){return (c,W,H,g)=>{const lay=stackLayout(p,glitchAns!=null?[glitchAns]:[]);const cols=lay.W+1;
  const x0=g*1,y0=g;c.textAlign='center';c.textBaseline='middle';
  const drawNum=(str,row,color,ghostN)=>{const off=cols-str.length;for(let i=0;i<str.length;i++){const cx=x0+(off+i)*g+g/2,cy=y0+row*g+g/2;
      c.fillStyle=(ghostN&&i>=str.length-ghostN)?'#c3c7d6':color;c.font='700 32px "JetBrains Mono",Menlo,monospace';c.fillText(str[i],cx,cy+2);
      const fromRight=str.length-1-i;const intPos=fromRight-lay.dp;
      if(lay.dp>0&&fromRight===lay.dp){c.fillText('.',x0+(off+i)*g+g-1,cy+8);}
      if(intPos>0&&intPos%3===0){c.font='700 24px "JetBrains Mono",Menlo,monospace';c.fillText(',',x0+(off+i+1)*g-1,cy+12);}}};
  lay.rows.forEach((r,i)=>drawNum(r,i,'#1f2340',lay.ghost[i]));
  c.font='700 32px "JetBrains Mono",Menlo,monospace';c.fillStyle='#1f2340';c.fillText(p.op,x0+g/2,y0+(lay.rows.length-1)*g+g/2+2);
  c.strokeStyle='#1f2340';c.lineWidth=3;c.beginPath();c.moveTo(x0,y0+lay.rows.length*g+2);c.lineTo(x0+(cols+0.2)*g,y0+lay.rows.length*g+2);c.stroke();
  if(glitchAns!=null){drawNum(lay.extras[0],lay.rows.length,'#0f8fa8');c.font='600 15px Lexend,sans-serif';c.textAlign='left';c.fillStyle='#0f8fa8';
    c.fillText('← Glitch’s answer',x0+(cols+0.4)*g,y0+lay.rows.length*g+g/2);}
  c.textAlign='left';};}

function rollRarity(ctx){const w=ctx==='boss'?[0,45,38,17]:ctx==='quest'?[30,42,22,6]:ctx==='great'?[50,32,14,4]:[64,26,8,2];
  const r=['common','rare','epic','legendary'];let x=Math.random()*100;for(let i=0;i<4;i++){x-=w[i];if(x<=0)return r[i];}return 'common';}
function prizeEligible(){const last=state.lastPrizeAt?new Date(state.lastPrizeAt).getTime():0,days=(Date.now()-last)/864e5,since=state.totals.problems-(state.prizeProblemsAt||0);
  if(since<30)return false;if(days>=8)return true;if(days>=5)return Math.random()<0.4;return false;}
function rollLoot(ctx){const I=inv();
  if((ctx==='boss'||ctx==='quest')&&prizeEligible())return{rarity:'legendary',type:'prize',name:'Pick dinner or dessert!',desc:'A real-world prize! Show a grown-up to make it official.'};
  const rarity=rollRarity(ctx),opts=[];
  for(const slot in PARTS)for(const p of PARTS[slot])if(p[2]===rarity&&!I.parts.includes(slot+':'+p[0]))opts.push({w:45,type:'part',slot,id:p[0],name:p[1],power:p[3]});
  for(const sp of SUPERS)if(sp[2]===rarity&&!I.supers.includes(sp[0]))opts.push({w:30,type:'super',id:sp[0],name:sp[1]});
  const tier=pr=>pr<=60?'common':pr<=150?'rare':pr<=250?'epic':'legendary';
  for(const cat of ['outfit','hat','cape','pet'])for(const it of CATALOG[cat])if(it.price>0&&tier(it.price)===rarity&&!state.owned.includes(cat+':'+it.id))opts.push({w:12,type:'gear',cat,id:it.id,name:it.name});
  const coins={common:25,rare:60,epic:120,legendary:300}[rarity];opts.push({w:opts.length?14:100,type:'coins',n:coins,name:coins+' coins'});
  let x=Math.random()*opts.reduce((s,o)=>s+o.w,0);for(const o of opts){x-=o.w;if(x<=0)return Object.assign({rarity},o);}return Object.assign({rarity},opts[opts.length-1]);}
function grantLoot(it){const I=inv();
  if(it.type==='part')I.parts.push(it.slot+':'+it.id);else if(it.type==='super')I.supers.push(it.id);else if(it.type==='gear')state.owned.push(it.cat+':'+it.id);
  else if(it.type==='coins')state.coins+=it.n;
  else if(it.type==='prize'){state.prizes=(state.prizes||[]).concat([{id:uid(),name:it.name,at:new Date().toISOString(),status:'pending'}]);state.lastPrizeAt=new Date().toISOString();state.prizeProblemsAt=state.totals.problems;}
  state.loot=(state.loot||[]).concat([{at:new Date().toISOString(),rarity:it.rarity,type:it.type,name:it.name}]).slice(-100);saveState();}

  if(it.type==='part'){const m=Object.assign(mechCfg(),{[it.slot]:it.id});drawMech(c,12*u,8*u,4*u,m,0,false,false);}
  else if(it.type==='gear'){if(it.cat==='pet')drawPet(c,it.id,24*u,40*u,8*u,0);else drawHero(c,36*u,16*u,6*u,Object.assign({},heroLook(),{[it.cat]:it.id}),'stand',0);}
  else if(it.type==='super'){const col=SUPER_COL[it.id]||'#ffe066';
    for(let i=0;i<12;i++){c.save();c.translate(60*u,60*u);c.rotate(i*Math.PI/6);c.fillStyle=col;c.fillRect(0,-3*u,52*u,6*u);c.restore();}
    c.fillStyle='#fff';c.beginPath();c.arc(60*u,60*u,18*u,0,6.28);c.fill();if(it.id==='dragon')drawDragon(c,20*u,40*u,3*u,0);}
  else if(it.type==='coins')drawSprite(c,COIN,36*u,36*u,8*u,{G:'#ffc933',W:'#fff3b0'});
  else drawSprite(c,["..GGGG..",".GYYYYG.","GYYGGYYG","GYYYYYYG","GYYGGYYG",".GYYYYG.","..GGGG.."],20*u,25*u,10*u,{G:'#ffc933',Y:'#fff3b0'});
  return cv;}
function openChest(ctx){const it=rollLoot(ctx),R=RARITY[it.rarity],P=[],F={};let phase='drop',pt=0;
  return Cine.play(999,(c,W,H,t,dt)=>{pt+=dt;c.fillStyle='rgba(8,10,25,1)';c.fillRect(0,0,W,H);const s=Math.max(5,Math.floor(Math.min(W,H)/70)),cx=W/2,cy=H*0.46;let y=cy,shake=0,open=false;
    if(phase==='drop'){y=Math.min(cy,-120+pt*H*2.2);if(y>=cy&&!F.l){F.l=1;Snd.slam();}if(pt>0.7){phase='wait';pt=0;}}
    else if(phase==='wait')y=cy+Math.sin(t*4)*4;
    else if(phase==='shake'){const k=(pt/0.3)|0;if(k!==F.k&&k<4){F.k=k;Snd.rattle();}shake=RM?0:8+k*6;
      if(pt>1.25){phase='burst';pt=0;Snd.reveal(it.rarity);for(let i=0;i<140;i++){const a=Math.random()*6.28,v=100+Math.random()*520;P.push({x:cx,y:cy-20,vx:Math.cos(a)*v,vy:Math.sin(a)*v-160,life:1+Math.random(),col:pick([R.c,'#fff','#ffe066'])});}}}

    if(phase!=='drop'){const gl=phase==='wait'?0.3:phase==='shake'?0.35+pt*0.5:1;c.save();c.translate(cx,cy);c.rotate(t*0.6);c.globalAlpha=0.22*gl;c.fillStyle=R.c;
      for(let i=0;i<12;i++){c.rotate(Math.PI/6);c.beginPath();c.moveTo(0,0);c.lineTo(Math.max(W,H),-50);c.lineTo(Math.max(W,H),50);c.fill();}c.restore();c.globalAlpha=1;}
    c.save();c.translate(cx+(shake?(Math.random()-0.5)*shake:0),y);drawChest(c,-12*s,-10*s,s,it.rarity,open);c.restore();
    for(const p of P){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;c.globalAlpha=Math.max(0,Math.min(1,p.life));c.fillStyle=p.col;c.fillRect(p.x,p.y,5,5);}c.globalAlpha=1;
    c.textAlign='center';c.font=`800 ${Math.round(Math.min(W,H)*0.05)}px "Pixelify Sans",monospace`;c.fillStyle='#fff';
    if(phase==='wait'||phase==='drop')c.fillText('LOOT CHEST!',cx,H*0.18);
    if(phase==='wait'){c.font=`700 ${Math.round(Math.min(W,H)*0.03)}px Lexend,sans-serif`;c.fillText('Tap the chest to open it!',cx,cy+16*s);}
  },{hold:end=>{const ui=Cine.el.querySelector('.cine-ui');
    const tapper=el('button',{class:'cine-tap',type:'button','aria-label':'Open the chest',onclick:()=>{if(phase!=='wait'&&phase!=='drop')return;Snd.init();if(phase==='drop'&&!F.l){F.l=1;Snd.slam();}phase='shake';pt=0;tapper.remove();
      setTimeout(()=>{grantLoot(it);const desc=it.type==='part'?`Mech part: ${it.slot} · Power +${it.power}`:it.type==='super'?'New super move! Equip it in the Mech Bay.':
          it.type==='gear'?'New gear! Wear it from the Shop.':it.type==='coins'?'Spend them in the Shop.':it.desc;
        ui.append(el('div',{class:'loot-card',style:'--rc:'+R.c},el('div',{class:'loot-r'},R.n),lootIcon(it,140),el('div',{class:'loot-n'},it.name),el('div',{class:'loot-d'},desc),
          el('button',{class:'btn btn-green',type:'button',onclick:()=>{Snd.coin();end();}},'Collect ▸')));},1550);}});
    ui.append(tapper);}});}

/* =========================================================
   Arcade: more games than just battles, so rewards never get old.
   After a round he gets one of: Boss Battle, Bug Whack, Dog Dash, Coin Catch.
   Boss levels are always a battle. Otherwise it rotates, never the same game twice in a row.
   Every game is short (20–25 s), has no game over, and always pays coins.
   ========================================================= */
const Arcade={
  KINDS:['battle','whack','dash','catch'],
  next(boss){if(boss)return 'battle';const A=state.arcade=state.arcade||{bag:[],last:null};
    if(!A.bag||!A.bag.length){A.bag=['battle','mech','whack','dash','catch','battle'].sort(()=>Math.random()-0.5);if(A.bag[0]===A.last)A.bag.push(A.bag.shift());}
    const k=A.bag.shift();A.last=k;saveState();return k;},
  // he picks the reward game (boss levels are always a battle). Surprise me = the rotation.
  pick(boss){if(boss)return Promise.resolve('battle');if(this.pickOff||(typeof Brawl!=='undefined'&&Brawl.off))return Promise.resolve(this.next(false));
    return new Promise(res=>{const A=state.arcade=state.arcade||{bag:[],last:null},opts=[['battle','⚔️','Battle'],['mech','🤖','Mech Battle'],['whack','🐞','Bug Whack'],['dash','🦴','Dog Dash'],['catch','🪙','Coin Catch'],['surprise','🎲','Surprise me']];
      const fin=k=>{overlay(null);Snd.tap();if(k==='surprise')k=this.next(false);else{A.last=k;A.picks=A.picks||{};A.picks[k]=(A.picks[k]||0)+1;saveState();}res(k);};
      overlay(el('div',{class:'modal arcade-pick'},el('h2',null,'Reward time! Pick a game'),el('div',{class:'ap-grid'},opts.map(([k,ic,nm])=>{const b=el('button',{class:'ap-btn ap-'+k,type:'button'},el('span',{class:'ic'},ic),el('b',null,nm));tapify(b,()=>fin(k));return b;}))));});},
  play(o){o=o||{};if(typeof Brawl!=='undefined'&&Brawl.off)return Promise.resolve(0);const k=o.kind||this.next(!!o.boss);
    if(k==='mech')return Brawl.play(Object.assign({},o,{mech:true}));if(k==='battle'||!Games[k])return Brawl.play(o);return Games[k](o);}
};
const Games={
  dog(){const p=heroLook().pet;return p&&PETS[p]&&PETS[p].dog?p:'ellie';},
  dname(id){return (typeof DogPower!=='undefined'&&DogPower.name?DogPower.name(id):'your dog');},
  // shared runner: intro → play → results. cfg.step/draw/tap do the game.
  run(cfg){const G={t:0,phase:'intro',score:0,combo:0,best:0,fx:[],txt:[],coins:0,done:false,end:null,W:0,H:0,ptr:null};
    G.say=(s,col,x,y,big)=>G.txt.push({s,col:col||'#fff',x,y,age:0,life:big?1.1:0.8,big:!!big});
    G.burst=(x,y,n,cols,sp)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||200)*(0.4+Math.random());G.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.4+Math.random()*0.4,col:pick(cols)});}};
    if(cfg.init)cfg.init(G);Music.play('battle');
    return Cine.play(999,(c,W,H,t,dtRaw)=>{const dt=document.hidden?0:dtRaw;G.W=W;G.H=H;G.t+=dt;
      if(G.phase==='intro'&&G.t>2.6){G.phase='play';G.t=0;}
      if(G.phase==='play'){cfg.step(G,dt);if(G.t>=cfg.len){G.phase='end';G.t=0;G.coins=clamp(Math.round(cfg.coins(G)),5,35);state.coins+=G.coins;
        const S=state.arcadeBest=state.arcadeBest||{};G.newBest=G.score>(S[cfg.id]||0);if(G.newBest)S[cfg.id]=G.score;saveState();Snd.fanfare();}}
      if(G.phase==='end'&&G.t>2.8&&!G.done){G.done=true;if(G.end)G.end();}
      for(const p of G.fx){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;}G.fx=G.fx.filter(p=>p.life>0);
      for(const x of G.txt)x.age+=dt;G.txt=G.txt.filter(x=>x.age<x.life);
      cfg.draw(c,G,W,H);
      for(const p of G.fx){c.globalAlpha=Math.min(1,p.life*2.5);c.fillStyle=p.col;c.fillRect(p.x,p.y,6,6);}c.globalAlpha=1;
      for(const x of G.txt){const k=x.age/x.life,sz=Math.round(Math.min(W,H)*(x.big?0.07:0.045));c.globalAlpha=k>0.7?(1-k)/0.3:1;c.font=`800 ${sz}px "Pixelify Sans",monospace`;c.textAlign='center';c.lineWidth=5;c.strokeStyle='#000';
        const xx=x.x!=null?x.x:W/2,yy=(x.y!=null?x.y:H*0.3)-k*40;c.strokeText(x.s,xx,yy);c.fillStyle=x.col;c.fillText(x.s,xx,yy);}c.globalAlpha=1;
      // HUD
      if(G.phase==='play'){const bw=Math.min(W*0.5,420),bx=(W-bw)/2,by=H*0.05;c.fillStyle='#000a';c.fillRect(bx-4,by-4,bw+8,18);c.fillStyle='#5ef2ff';c.fillRect(bx,by,bw*Math.max(0,1-G.t/cfg.len),10);
        const fs=Math.round(Math.min(W,H)*0.05);c.font=`800 ${fs}px "Pixelify Sans",monospace`;c.textAlign='left';c.lineWidth=5;c.strokeStyle='#000';const st=cfg.icon+' '+G.score;c.strokeText(st,16,by+fs);c.fillStyle='#ffe066';c.fillText(st,16,by+fs);
        if(G.combo>=3){c.textAlign='right';c.strokeText('x'+G.combo,W-16,by+fs*2.2);c.fillStyle='#ff7b1c';c.fillText('x'+G.combo,W-16,by+fs*2.2);}}
      if(G.phase==='intro')Cine.title(c,W,H,G.t,cfg.title,cfg.col,cfg.how);
      if(G.phase==='end')Cine.title(c,W,H,G.t,G.newBest?'NEW BEST!':'TIME!','#ffe066',`${cfg.icon} ${G.score} · +${G.coins} coins`);},
    {skip:true,hold:end=>{G.end=end;const ui=$('#cine .cine-ui'),pad=el('div',{class:'ag-pad'});
      const pt=e=>{const r=$('#cine').getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
      pad.addEventListener('pointerdown',e=>{e.preventDefault();Snd.init();const p=pt(e);G.ptr=p;try{pad.setPointerCapture(e.pointerId);}catch(_){}if(G.phase==='play'&&cfg.tap)cfg.tap(G,p.x,p.y);});
      pad.addEventListener('pointermove',e=>{if(G.ptr)G.ptr=pt(e);});['pointerup','pointercancel'].forEach(k=>pad.addEventListener(k,()=>{G.ptr=null;}));
      ui.append(pad);if(typeof window!=='undefined')Games.G=G;}})
      .then(()=>{if(!G.done&&G.phase==='play'){G.coins=clamp(Math.round(cfg.coins(G)),5,35);state.coins+=G.coins;saveState();}
        Music.play(typeof run!=='undefined'&&run&&run.spec&&run.spec.mech?'boss':'battle');return G.coins;});},
  sky(c,W,H,a,b){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,W,H);},
  bug(c,x,y,s,col,t){const leg=(t*12|0)%2;c.fillStyle='#1d1f33';for(let i=0;i<3;i++){c.fillRect(x-5*s,y+(i*2-1+leg*0.5)*s,10*s,s);}
    c.fillStyle=col;c.fillRect(x-4*s,y-3*s,8*s,6*s);c.fillRect(x-3*s,y-4*s,6*s,8*s);c.fillStyle='#ffffff';c.fillRect(x-2*s,y-2*s,s*1.5,s*1.5);c.fillRect(x+s,y-2*s,s*1.5,s*1.5);
    c.fillStyle='#1d1f33';c.fillRect(x-1.6*s,y-1.6*s,s*0.8,s*0.8);c.fillRect(x+1.4*s,y-1.6*s,s*0.8,s*0.8);c.fillRect(x-2*s,y-6*s,s,2*s);c.fillRect(x+s,y-6*s,s,2*s);},

  /* ---------- BUG WHACK: tap the bugs as they pop up. Golden bug +3. Glitch +5. Don't bonk your dog! */
  whack(o){const dog=this.dog(),dn=this.dname(dog),form=glitchForm();let holes=[];
    return this.run({id:'whack',title:'BUG WHACK!',col:'#3fdc6b',icon:'🐞',len:22,how:`Tap the bugs! Golden bug +3 · Glitch +5 · Don’t bonk ${dn}!`,
      init(G){G.spawn=0.3;G.dogT=4+Math.random()*3;},
      layout(G){const W=G.W,H=G.H,cell=Math.min(W*0.26,H*0.22),gx=W/2-cell,gy=H*0.32;holes=[];for(let r=0;r<3;r++)for(let i=0;i<3;i++)holes.push({x:gx+i*cell,y:gy+r*cell*0.95,r:cell*0.36});return holes;},
      step(G,dt){if(!G.H2||G.H2!==G.H){G.H2=G.H;const old=G.holes||[];G.holes=this.layout(G).map((h,i)=>Object.assign(h,{who:old[i]?old[i].who:null,up:old[i]?old[i].up:0,life:old[i]?old[i].life:0}));}
        const speed=1-Math.min(0.4,G.t/50);G.spawn-=dt;G.dogT-=dt;
        for(const h of G.holes){if(h.who){h.life-=dt;h.up=Math.min(1,h.up+dt*7);if(h.life<=0){h.out=Math.max(0,(h.out||1)-dt*6);if(h.out<=0){if((h.who==='bug'||h.who==='gold')&&!h.hit)G.combo=0;h.who=null;h.out=1;h.up=0;}}}}
        if(G.spawn<=0){G.spawn=(0.45+Math.random()*0.35)*speed;const free=G.holes.filter(h=>!h.who);if(free.length){const h=pick(free);
          let who=Math.random()<0.1?'gold':Math.random()<0.08?'glitch':'bug';if(G.dogT<=0){who='dog';G.dogT=4+Math.random()*4;}
          h.who=who;h.life=(who==='dog'?1.4:who==='glitch'?0.75:1.05)*speed+0.15;h.up=0;h.out=1;h.hit=false;}}},
      tap(G,x,y){for(const h of G.holes){if(!h.who||h.life<=0)continue;if(Math.hypot(x-h.x,y-(h.y-h.r*0.6))>h.r*1.25)continue;
          if(h.who==='dog'){h.life=0;G.say('WOOF! That’s '+dn+'!','#ff8fa3',h.x,h.y-h.r*1.5);Snd.tone(520,0.1,'square',0.05);Snd.tone(420,0.12,'square',0.05,0.1);G.combo=0;return;}
          const v=h.who==='gold'?3:h.who==='glitch'?5:1;h.hit=true;G.combo++;G.best=Math.max(G.best,G.combo);G.score+=v;h.life=0;
          G.burst(h.x,h.y-h.r*0.6,h.who==='bug'?14:26,h.who==='glitch'?['#ff4d6d','#5ef2ff','#fff']:['#3fdc6b','#ffe066','#fff'],240);
          G.say(h.who==='glitch'?'BONK GLITCH! +5':h.who==='gold'?'GOLDEN! +3':pick(['SPLAT!','BONK!','GOT IT!','POW!']),h.who==='bug'?'#fff':'#ffe066',h.x,h.y-h.r*1.4);
          if(h.who==='bug')Snd.coin();else Snd.gem();if(G.combo%10===0)G.say('COMBO x'+G.combo+'!','#ff7b1c',null,null,true);return;}
        G.say('miss','#ffffff88',x,y);},
      coins:G=>6+G.score*0.6,
      draw(c,G,W,H){Games.sky(c,W,H,'#3a8a3a','#1e5a2a');c.fillStyle='#4aa04a';for(let i=0;i<30;i++){c.fillRect((i*137)%W,(i*71)%H,4,10);}
        if(!G.holes)return;const s=Math.max(2,G.holes[0].r/5.5);
        for(const h of G.holes){c.fillStyle='#2a1a0a';c.beginPath();c.ellipse(h.x,h.y,h.r,h.r*0.38,0,0,6.28);c.fill();
          if(h.who){const k=h.life>0?h.up:(h.out||0),rise=h.r*1.1*k;c.save();c.beginPath();c.rect(h.x-h.r*1.5,h.y-h.r*3,h.r*3,h.r*3);c.clip();const cy=h.y+h.r*0.4-rise;
            if(h.who==='dog'){const ps=s*0.6,rows=PETS[dog].rows,w=rows[0].length*ps;drawPet(c,dog,h.x-w/2,cy-rows.length*ps*0.5,ps,G.t);}
            else if(h.who==='glitch'){drawGlitch(c,h.x-6*s*0.6,cy-6*s*0.6,s*0.6,form,G.t,h.life<=0);}
            else Games.bug(c,h.x,cy,s*0.9,h.who==='gold'?'#ffc933':'#3fdc6b',G.t);c.restore();}
          c.fillStyle='#5a3a1a';c.beginPath();c.ellipse(h.x,h.y+h.r*0.06,h.r,h.r*0.2,0,0,3.14);c.fill();}}});},

  /* ---------- DOG DASH: his dog runs; tap to jump (tap again in the air to double jump). Grab bones, hop the bugs. */
  dash(o){const dog=this.dog(),dn=this.dname(dog),look=heroLook();
    return this.run({id:'dash',title:'DOG DASH!',col:'#ffb627',icon:'🦴',len:25,how:`Tap to jump with ${dn}! Tap again to jump higher. HOLD to glide! Grab the bones.`,
      init(G){G.d={y:0,vy:0,jumps:0,stun:0};G.obj=[];G.next=2.6;G.boneT=0.4;G.x=0;G.mag=0;G.magT=7;G.glide=false;},
      tap(G){const d=G.d;if(d.jumps<2){d.vy=-G.H*(d.jumps?1.05:1.25);d.jumps++;Snd.tone(d.jumps>1?880:660,0.08,'square',0.04,0,d.jumps>1?1320:990);}},
      step(G,dt){const H=G.H,W=G.W,d=G.d,sp=W*(0.30+Math.min(0.12,G.t*0.006)),gy=H*0.72,ps=Math.max(3,H/72),dx=W*0.28;G.x+=sp*dt;d.stun=Math.max(0,d.stun-dt);G.mag=Math.max(0,G.mag-dt);
        // floaty jumps; holding the screen while falling glides
        d.vy+=H*3.2*dt;G.glide=!!G.ptr&&d.vy>0&&d.y<-2;if(G.glide)d.vy=Math.min(d.vy,H*0.28);d.y+=d.vy*dt;if(d.y>0){d.y=0;d.vy=0;d.jumps=0;}
        // bugs: few and far apart
        G.next-=dt;if(G.next<=0){G.next=1.7+Math.random()*1.0;G.obj.push({k:Math.random()<0.15?'glitchbug':'bug',x:W+40});}
        // bones: singles, and arches that one jump sweeps up
        G.boneT-=dt;if(G.boneT<=0){if(Math.random()<0.5){G.boneT=1.3;for(let i=0;i<5;i++)G.obj.push({k:'bone',x:W+40+i*W*0.045,h:0.05+Math.sin(i/4*Math.PI)*0.15});}
          else{G.boneT=0.5+Math.random()*0.4;G.obj.push({k:Math.random()<0.1?'gold':'bone',x:W+40,h:pick([0,0.06,0.12])});}}
        G.magT-=dt;if(G.magT<=0){G.magT=9;G.obj.push({k:'mag',x:W+40,h:0.08});}
        const dy=gy+d.y,isB=b=>b.k==='bone'||b.k==='gold'||b.k==='mag';
        for(const b of G.obj){b.x-=sp*dt;if(b.got)continue;
          if(G.mag>0&&(b.k==='bone'||b.k==='gold')&&b.x>dx-ps*4&&b.x<dx+W*0.4){b.pull=true;}
          if(b.pull){b.x+=(dx-b.x)*Math.min(1,dt*7);b.h+=((-d.y/H+0.04)-b.h)*Math.min(1,dt*7);}
          const by=isB(b)?gy-H*0.06-b.h*H:gy-ps*3;
          if(isB(b)?(Math.abs(b.x-dx)<ps*7&&Math.abs(by-(dy-ps*4))<ps*9):(Math.abs(b.x-dx)<ps*3.5&&d.y>-ps*1.5)){
            if(b.k==='mag'){b.got=true;G.mag=5;Snd.gem();G.say('BONE MAGNET!','#ff4d6d',null,null,true);G.burst(b.x,by,20,['#ff4d6d','#fff','#ffe066'],220);}
            else if(isB(b)){b.got=true;const v=b.k==='gold'?5:1;G.score+=v;G.combo++;G.best=Math.max(G.best,G.combo);Snd.tone(660+Math.min(G.combo,14)*45,0.07,'square',0.04);G.burst(b.x,by,10,['#fff','#ffe066'],160);if(v>1)G.say('GOLDEN BONE +5','#ffe066',b.x,by-30);
              if(G.combo%10===0){G.say(G.combo+' IN A ROW!','#ff7b1c',null,null,true);G.burst(dx,dy-ps*8,40,['#ff4d6d','#ffe066','#5ef2ff','#3fdc6b'],300);Snd.gem();}}
            else if(d.stun<=0){b.got=true;d.stun=0.35;G.combo=0;Snd.tone(300,0.12,'square',0.04,0,200);G.say(pick(['Oops!','Boing!','Wobble!']),'#ff9f43',dx,dy-ps*12);}}
          else if(!isB(b)&&!b.got&&!b.passed&&b.x<dx-ps*4){b.passed=true;G.score+=1;G.say('HOP! +1','#5ef2ff',dx,dy-ps*12);}}
        G.obj=G.obj.filter(b=>b.x>-60&&!(b.got&&isB(b)));},
      coins:G=>6+G.score*0.5,
      draw(c,G,W,H){Games.sky(c,W,H,'#6ec6ff','#d8f1ff');const gy=H*0.72,ps=Math.max(3,H/72),x=G.x||0;
        c.fillStyle='#ffffffcc';for(let i=0;i<5;i++){const cx=((i*W*0.31-x*0.1)%(W+200)+W+200)%(W+200)-100;c.fillRect(cx,H*(0.12+i%3*0.07),90,22);c.fillRect(cx+20,H*(0.12+i%3*0.07)-14,50,16);}
        c.fillStyle='#7ccf6a';for(let i=0;i<7;i++){const hx=((i*W*0.22-x*0.3)%(W+300)+W+300)%(W+300)-150;c.beginPath();c.arc(hx,gy,W*0.14,3.14,6.28);c.fill();}
        c.fillStyle='#4aa04a';c.fillRect(0,gy,W,H-gy);c.fillStyle='#3a8a3a';for(let i=0;i<40;i++){c.fillRect(((i*60-x)%W+W)%W,gy+8+(i%3)*14,20,4);}
        for(const b of G.obj){if(b.got)continue;if(b.k==='mag'){const by=gy-H*0.06-b.h*H+Math.sin(G.t*6)*5;c.font=`${Math.round(ps*7)}px sans-serif`;c.textAlign='center';c.fillText('🧲',b.x,by+ps*2);continue;}if(b.k==='bone'||b.k==='gold'){const by=gy-H*0.06-b.h*H,bob=Math.sin(G.t*6+b.x*0.02)*4;c.fillStyle=b.k==='gold'?'#ffc933':'#fff8e8';
            c.fillRect(b.x-ps*3,by+bob-ps*0.6,ps*6,ps*1.2);c.beginPath();for(const [ox,oy] of [[-3,-0.8],[-3,0.8],[3,-0.8],[3,0.8]]){c.moveTo(b.x+ox*ps,by+bob+oy*ps);c.arc(b.x+ox*ps,by+bob+oy*ps,ps,0,6.28);}c.fill();}
          else Games.bug(c,b.x,gy-ps*3,ps*0.8,b.k==='glitchbug'?'#ff4d6d':'#3fdc6b',G.t);}
        // JUMP! warning over a bug that's coming
        {const d0=G.d||{y:0},dx0=W*0.28;for(const b of G.obj){if(b.got||b.passed||b.k==='bone'||b.k==='gold'||b.k==='mag')continue;const dd=b.x-dx0;if(dd>0&&dd<W*0.24&&d0.y>-ps*2){const fs=Math.round(ps*4.5);c.font=`900 ${fs}px "Pixelify Sans",monospace`;c.textAlign='center';c.lineWidth=5;c.strokeStyle='#000';const yy=gy-ps*10+Math.sin(G.t*14)*3;c.strokeText('JUMP!',b.x,yy);c.fillStyle='#ffe066';c.fillText('JUMP!',b.x,yy);c.fillText('▼',b.x,yy+fs*0.8);break;}}}
        const d=G.d||{y:0,stun:0},dx=W*0.28,rows=PETS[dog].rows,w=rows[0].length*ps,blink=d.stun>0&&((G.t*12|0)%2);
        if(G.glide){for(let i=0;i<3;i++){c.fillStyle=pick(['#ffffff','#5ef2ff','#ffe066']);c.fillRect(dx-w/2-ps*(2+i*3),gy-rows.length*ps*0.5+d.y+(Math.random()-0.5)*ps*4,ps*1.5,ps*1.5);}}
        if(G.mag>0){c.strokeStyle='#ff4d6d88';c.lineWidth=3;c.beginPath();c.arc(dx,gy-rows.length*ps*0.5+d.y,ps*9+Math.sin(G.t*10)*ps,0,6.28);c.stroke();}
        if(!blink){c.save();const run=G.phase==='play'&&d.y===0?Math.abs(Math.sin(G.t*14))*ps:0;drawPet(c,dog,dx-w/2,gy-rows.length*ps+d.y-run,ps,G.t);c.restore();}
        const hs=ps*0.85;drawHero(c,dx-w/2-14*hs,gy-15*hs+d.y*0.9,hs,look,G.phase!=='play'?'stand':d.y<0?'jump':((G.t*10|0)%2?'runA':'runB'),G.t);
        if(d.stun>0){c.font='700 22px sans-serif';c.textAlign='center';c.fillText('💫',dx,gy-rows.length*ps-10+d.y);}}});},

  /* ---------- COIN CATCH: drag left and right to catch falling coins and gems. Dodge Glitch's bombs. His dog helps fetch. */
  catch(o){const dog=this.dog(),dn=this.dname(dog),look=heroLook(),form=glitchForm(),ride=look.ride&&look.ride!=='none'&&typeof Rides!=='undefined'?look.ride:null;
    return this.run({id:'catch',title:'COIN CATCH!',col:'#ffe066',icon:'🪙',len:22,how:`Drag left and right to catch coins! Dodge Glitch’s bombs. ${dn} helps!`,
      init(G){G.hx=null;G.dx=null;G.drops=[];G.spawn=0.4;G.stun=0;G.gx=0.5;G.gv=0.25;},
      step(G,dt){const W=G.W,H=G.H,gy=H*0.82;if(G.hx==null){G.hx=W*0.5;G.dx=W*0.3;}
        G.stun=Math.max(0,G.stun-dt);if(G.ptr&&G.stun<=0){G.hx+=(clamp(G.ptr.x,W*0.06,W*0.94)-G.hx)*Math.min(1,dt*14);}
        G.gx+=G.gv*dt;if(G.gx>0.85||G.gx<0.15)G.gv*=-1;
        G.spawn-=dt;if(G.spawn<=0){G.spawn=0.32+Math.random()*0.3-Math.min(0.12,G.t*0.005);const r=Math.random(),k=r<0.18?'bomb':r<0.28?'gem':'coin';
          G.drops.push({k,x:k==='bomb'?W*G.gx:W*(0.06+Math.random()*0.88),y:H*0.16,v:H*(0.32+Math.random()*0.2+G.t*0.006)});}
        // dog chases the nearest low coin, slower than him
        const tgt=G.drops.filter(d=>d.k!=='bomb'&&!d.got&&d.y>H*0.45).sort((a,b)=>b.y-a.y)[0];if(tgt)G.dx+=clamp(tgt.x-G.dx,-W*0.32*dt,W*0.32*dt);
        for(const d of G.drops){d.y+=d.v*dt;if(d.got)continue;
          const s=Math.max(3,H/80),near=(x,r)=>Math.abs(d.x-x)<r&&d.y>gy-17*s&&d.y<gy;
          if(near(G.hx,W*0.07)){d.got=true;if(d.k==='bomb'){if(G.stun<=0){G.stun=0.8;G.combo=0;Snd.boom();G.burst(d.x,d.y,30,['#ff7b1c','#ff4d6d','#fff'],260);G.say('BOOM!','#ff4d6d',d.x,d.y-40);}}
            else{const v=d.k==='gem'?3:1;G.score+=v;G.combo++;G.best=Math.max(G.best,G.combo);if(v>1)Snd.gem();else Snd.coin();G.burst(d.x,d.y,8,['#ffe066','#fff'],140);if(v>1)G.say('GEM +3','#5ef2ff',d.x,d.y-30);if(G.combo%10===0)G.say(G.combo+' IN A ROW!','#ff7b1c',null,null,true);}}

/* =========================================================
   Blocks: simple animated block pictures for facts.
   hint(f): after a miss, shows the fact with blocks but never the answer. He tries again.
   show(f): after a right answer on a fact he's still learning, replays it with blocks and the answer.
   ========================================================= */
const Blocks={
  // grid of cells. cells: [{k:'b'|'o'|'e'|'x', d:delay}] laid out in rows of `per`, with a gap after 5
  grid(cells,per,size,labels){const wrap=el('div',{class:'bk-grid',style:`--c:${size}px`});
    for(let r=0;r*per<cells.length;r++){const row=el('div',{class:'bk-row'});
      cells.slice(r*per,r*per+per).forEach((c,i)=>{const b=el('i',{class:'bk '+c.k+(per===10&&i===4?' gap':''),style:`animation-delay:${c.d||0}s`});if(c.x!=null)b.style.setProperty('--xd',c.x+'s');row.append(b);});
      if(labels&&labels[r]!=null)row.append(el('span',{class:'bk-lab',style:`animation-delay:${labels[r].d}s`},labels[r].s));
      wrap.append(row);}return wrap;},
  box(cls,grid,text){return el('div',{class:'bk-box '+cls},grid,text?el('p',{class:'bk-say'},text):null);},
  // multiplication: which factor to count by (2s, 5s and 10s are easiest, then the smaller number)
  mulPlan(a,b){const easy=[10,5,2];for(const e of easy){if(a===e)return {by:a,rows:b};if(b===e)return {by:b,rows:a};}const by=Math.min(a,b);return {by,rows:Math.max(a,b)};},
  cells(n,k,d0,step){return Array.from({length:n},(_,i)=>({k,d:d0+i*(step||0)}));},
  hint(f){const {op,a,b}=f;let g=null,t='';const S=0.12;
    if(op==='+'){const hi=Math.max(a,b),lo=Math.min(a,b),tot=hi+lo;
      g=this.grid(this.cells(hi,'b',0,0.02).concat(this.cells(lo,'o',0.4,0.22)),10,tot>20?20:32);
      if(a===b)t=`Double ${a}: two groups of ${a}.`;else if(hi-lo===1)t=`Near double: ${lo} + ${lo} is a double. Then 1 more.`;
      else if(tot>10&&hi<10)t=`Fill the ten first: ${hi} + ${10-hi} makes 10. How many oranges spill over?`;
      else if(hi===10)t=`10 and ${lo} more.`;else t=`Start at ${hi}. Count on ${lo} more.`;}
    else if(op==='−'){const cs=Array.from({length:a},(_,i)=>i>=a-b?{k:'b x',d:0,x:0.5+(a-1-i)*0.22}:{k:'b',d:0});
      g=this.grid(cs,10,a>20?20:32);
      t=a>10&&b>a-10&&b<10?`Take away ${a-10} to get down to 10. Then take away ${b-(a-10)} more. How many are left?`:`Start with ${a}. Take away ${b}. How many are left? Or think: ${b} + ? = ${a}.`;}
    else if(op==='×'){const P=this.mulPlan(a,b),size=P.rows*P.by>60?16:P.rows*P.by>30?20:28,cs=[],labs=[];
      for(let r=0;r<P.rows;r++){cs.push(...this.cells(P.by,r%2?'o':'b',0.25*r,0));labs.push({s:r<P.rows-1?String(P.by*(r+1)):'?',d:0.25*r+0.15});}
      g=this.grid(cs,P.by,size,labs);t=`${P.rows} rows of ${P.by}. Count by ${P.by}s.`;}
    else if(op==='÷'){const rows=f.ans,size=a>60?16:a>30?20:28,cs=[];for(let r=0;r<rows;r++)cs.push(...this.cells(b,r%2?'o':'b',0.3*r,0));
      g=this.grid(cs,b,size);t=`Put ${a} into rows of ${b}. How many rows?`;}
    else if(op==='+?'){g=this.grid(this.cells(a,'b',0,0.02).concat(this.cells(b-a,'e',0.4,0.15)),10,b>20?20:32);t=`You have ${a}. How many more to make ${b}? Count the empty spots.`;}
    else if(op==='−?'){const cs=Array.from({length:a},(_,i)=>i>=b?{k:'b x',d:0,x:0.5+(i-b)*0.2}:{k:'b',d:0});g=this.grid(cs,10,a>20?20:32);t=`${a} take away how many leaves ${b}? Count the crossed ones.`;}
    if(!g)return null;return this.box('bk-hint',g,t);},
  // after a right answer: the same picture, with the answer
  show(f){const {op,a,b,ans}=f;let g=null;
    if(op==='+'){const hi=Math.max(a,b),lo=Math.min(a,b);g=this.grid(this.cells(hi,'b',0,0.015).concat(this.cells(lo,'o',0.2,0.05)),10,ans>20?18:28);}
    else if(op==='−'){g=this.grid(Array.from({length:a},(_,i)=>i>=a-b?{k:'b x',d:0,x:0.15+(a-1-i)*0.05}:{k:'b',d:0}),10,a>20?18:28);}
    else if(op==='×'){const P=this.mulPlan(a,b),cs=[],labs=[];for(let r=0;r<P.rows;r++){cs.push(...this.cells(P.by,r%2?'o':'b',0.08*r,0));labs.push({s:String(P.by*(r+1)),d:0.08*r+0.05});}g=this.grid(cs,P.by,ans>60?14:ans>30?18:22,labs);}
    else if(op==='÷'){const cs=[];for(let r=0;r<ans;r++)cs.push(...this.cells(b,r%2?'o':'b',0.08*r,0));g=this.grid(cs,b,a>60?12:14);}
    else if(op==='+?'){g=this.grid(this.cells(a,'b',0,0.015).concat(this.cells(ans,'o',0.2,0.05)),10,b>20?18:28);}
    else if(op==='−?'){g=this.grid(Array.from({length:a},(_,i)=>i>=b?{k:'b x',d:0,x:0.15+(i-b)*0.05}:{k:'b',d:0}),10,a>20?18:28);}
    if(!g)return null;const ex=op==='+?'?`${a} + ${ans} = ${b}`:op==='−?'?`${a} − ${ans} = ${b}`:`${a} ${op} ${b} = ${ans}`;
    return el('div',{class:'bk-box bk-show'},g,el('b',{class:'bk-ans'},ex));}
};

/* =========================================================
   Lessons: short narrated animations (about a minute) that teach one idea.
   borrow:  three common borrowing mistakes, and the right way (with a check by adding back)
   countup: subtract by counting UP from the smaller number; count the jumps, not the numbers
   Narration uses the iPad's built-in voice (speechSynthesis). Captions always show.
   ========================================================= */
const Lesson={off:false,
  // recorded narration (audio/<lesson>-<step>.mp3) and each clip's length in seconds; the iPad voice is only a fallback

  au(){if(!this.audio){this.audio=new Audio();this.audio.preload='auto';}return this.audio;},
  // iPad only lets sound play after a tap: unlock the narration player on his first tap anywhere

  clip(k,i,txt){if(state.mute)return;const a=this.au();try{if(window.speechSynthesis)speechSynthesis.cancel();a.muted=false;a.src='audio/'+k+'-'+i+'.mp3';a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>this.speak(txt));}catch(e){this.speak(txt);}},
  NAMES:{borrow:'Borrowing: 3 sneaky mistakes',countup:'Count UP to subtract'},
  voice:null,
  speak(txt){try{if(state.mute||!window.speechSynthesis)return;const S=speechSynthesis;S.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/=/g,' equals '));
      if(!this.voice){const vs=S.getVoices();this.voice=vs.find(v=>/en-US/.test(v.lang)&&/Samantha|Alex|Google US/.test(v.name))||vs.find(v=>/en-US/.test(v.lang))||null;}
      if(this.voice)u.voice=this.voice;u.rate=0.95;u.pitch=1.05;S.speak(u);}catch(e){}},
  hush(){try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}try{if(this.audio)this.audio.pause();}catch(e){}},
  seen(k){return !!(state.lessons&&state.lessons[k]);},
  // auto-play once, the first time he needs it
  maybe(k){if(this.seen(k)||this.off)return Promise.resolve(false);return this.play(k).then(()=>true);},
  btn(k,label){const b=el('button',{class:'btn btn-dark lesson-btn',type:'button'},'▶ '+(label||'Watch: '+this.NAMES[k]));tapify(b,()=>{Snd.init();this.play(k);});return b;},
  play(k){const steps=this.STEPS[k]();if(!steps)return Promise.resolve();const L=state.lessons=state.lessons||{};L[k]=(L[k]||0)+1;saveState();
    const held=typeof Pause!=='undefined'&&Pause.hold&&Pause.hold();let si=-1,t0=0,total=0;
    const C=this.CLIPS[k]||[];steps.forEach((s,i)=>{s.d=Math.max(s.t||3,C[i]!=null?C[i]+0.7:(s.say||'').split(/\s+/).length/2.5+0.9);s.at=total;total+=s.d;});
    this.clip(k,0,steps[0].say||'');si=0; // first line inside the tap, so iPad allows the voice
    const look=heroLook(),dog=look.pet&&PETS[look.pet]&&PETS[look.pet].dog?look.pet:'ellie';
    return Cine.play(total+0.4,(c,W,H,t)=>{let i=steps.length-1;for(let j=0;j<steps.length;j++)if(t<steps[j].at+steps[j].d){i=j;break;}
      if(i!==si){si=i;this.clip(k,i,steps[i].say||'');}
      const s=steps[i],kk=Math.min(1,Math.max(0,(t-s.at)/s.d));
      const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14204a');g.addColorStop(1,'#241640');c.fillStyle=g;c.fillRect(0,0,W,H);
      c.fillStyle='#ffffff10';for(let x=0;x<W;x+=40)c.fillRect(x,0,1,H);for(let y=0;y<H;y+=40)c.fillRect(0,y,W,1);

      // caption
      const cap=s.cap||s.say||'';if(cap){const fs=Math.round(Math.min(W*0.032,H*0.045,26));c.font=`600 ${fs}px Lexend,sans-serif`;c.textAlign='center';
        const words=cap.split(' '),lines=[];let ln='';for(const w of words){const tt=ln?ln+' '+w:w;if(c.measureText(tt).width>W*0.86&&ln){lines.push(ln);ln=w;}else ln=tt;}if(ln)lines.push(ln);
        const lh=fs*1.35,y0=H-24-lines.length*lh;c.fillStyle='#000a';c.fillRect(W*0.05,y0-fs,W*0.9,lines.length*lh+fs*0.7);c.fillStyle='#fff';lines.forEach((l,j)=>c.fillText(l,W/2,y0+j*lh+fs*0.15));}
      // progress
      c.fillStyle='#ffffff22';c.fillRect(0,0,W,5);c.fillStyle='#5ef2ff';c.fillRect(0,0,W*Math.min(1,t/total),5);},{skip:true})
      .then(()=>{this.hush();if(held)Pause.release();});},

  // ---------- drawing helpers
  T(c,txt,x,y,sz,col,al){c.font=`800 ${sz}px Lexend,sans-serif`;const mw=(Cine.W||1000)*0.92;while(c.measureText(txt).width>mw&&sz>12){sz-=2;c.font=`800 ${sz}px Lexend,sans-serif`;}c.textAlign=al||'center';c.textBaseline='middle';c.fillStyle=col||'#fff';c.fillText(txt,x,y);c.textBaseline='alphabetic';},
  title(c,W,H,k,a,b){const sz=Math.round(Math.min(W*0.07,H*0.1));c.globalAlpha=Math.min(1,k*4);this.T(c,a,W/2,H*0.36,sz,'#ffe066');if(b)this.T(c,b,W/2,H*0.36+sz*1.1,Math.round(sz*0.45),'#cfd5ff');c.globalAlpha=1;},
  // stacked subtraction. top/bot are digit strings. o: cross {col:newText}, ans string, ansCol, hi col, x mark, ok mark, flip note
  stack(c,W,H,top,bot,o){o=o||{};const n=Math.max(top.length,bot.length),cw=Math.min(W*0.1,H*0.13,90),fs=Math.round(cw*0.8),right=W*0.5+n*cw/2,y1=H*0.3,y2=y1+fs*1.3,yl=y2+fs*0.55,y3=yl+fs*0.85;
    const X=i=>right-i*cw-cw/2;
    if(o.hi!=null){c.fillStyle='#ffe06630';c.fillRect(X(o.hi)-cw*0.45,y1-fs*1.3,cw*0.9,y3-y1+fs*1.8);}
    const dig=(s,i)=>s[s.length-1-i];
    for(let i=0;i<n;i++){const d=dig(top,i);if(d==null)continue;const cr=o.cross&&o.cross[i]!=null;this.T(c,d,X(i),y1,fs,cr?'#8a94ad':'#fff');
      if(cr){c.strokeStyle='#ff4d6d';c.lineWidth=Math.max(3,fs*0.08);c.beginPath();c.moveTo(X(i)-fs*0.35,y1+fs*0.35);c.lineTo(X(i)+fs*0.35,y1-fs*0.35);c.stroke();this.T(c,o.cross[i],X(i),y1-fs*0.95,Math.round(fs*0.55),'#ffb627');}}
    for(let i=0;i<n;i++){const d=dig(bot,i);if(d!=null)this.T(c,d,X(i),y2,fs,'#fff');}
    this.T(c,o.op||'−',X(n-1)-cw*0.85,y2,fs,'#fff');
    c.fillStyle='#fff';c.fillRect(X(n-1)-cw*1.2,yl,n*cw+cw*0.75,Math.max(3,fs*0.07));
    if(o.ans){for(let i=0;i<o.ans.length;i++){const d=o.ans[o.ans.length-1-i];this.T(c,d,X(i),y3,fs,o.ansCol||'#3fdc6b');}}
    if(o.x){c.strokeStyle='#ff4d6d';c.lineWidth=8;const xx=right+cw*0.9,yy=y3;c.beginPath();c.moveTo(xx-22,yy-22);c.lineTo(xx+22,yy+22);c.moveTo(xx+22,yy-22);c.lineTo(xx-22,yy+22);c.stroke();}
    if(o.ok){this.T(c,'✓',right+cw*0.9,y3,fs,'#3fdc6b');}
    return {X,y1,y2,y3,cw,fs};},
  numberLine(c,W,H,lo,hi){const x0=W*0.1,x1=W*0.9,X=v=>x0+(v-lo)/(hi-lo)*(x1-x0),y=H*0.58,fs=Math.round(Math.min(W*0.035,26));
    c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.moveTo(x0-20,y);c.lineTo(x1+20,y);c.stroke();
    for(let v=lo;v<=hi;v++){c.lineWidth=v%5===0?4:2;c.beginPath();c.moveTo(X(v),y-12);c.lineTo(X(v),y+12);c.stroke();this.T(c,String(v),X(v),y+34,fs,'#fff');}return {X,y};},
  arc(c,xa,xb,y,k,col,lab){if(k<=0)return;const h=Math.min(90,(xb-xa)*0.6+30);c.strokeStyle=col||'#ffb627';c.lineWidth=4;c.beginPath();
    const N=24;for(let i=0;i<=N*k;i++){const q=i/N,x=xa+(xb-xa)*q,yy=y-14-Math.sin(q*Math.PI)*h;i?c.lineTo(x,yy):c.moveTo(x,yy);}c.stroke();

  dogAt(c,id,x,y,s){const p=PETS[id],w=p.rows[0].length*s,h=p.rows.length*s;drawPet(c,id,x-w/2,y-h,s,0);},

  STEPS:{
    countup(){const L=Lesson;const ds=(W,H)=>Math.max(4,Math.round(Math.min(W,H)/65));
      // where the dog is on the line, hopping one jump at a time
      const hopX=(nl,pts,k)=>{const n=pts.length-1,q=k*n,i=Math.min(n-1,Math.floor(q)),f=q-i,xa=nl.X(pts[i]),xb=nl.X(pts[i+1]);return {x:xa+(xb-xa)*f,lift:Math.sin(f*Math.PI)*60,i,f};};
      const line=(c,W,H,lo,hi,expr)=>{L.T(c,expr,W/2,H*0.2,Math.round(Math.min(W*0.08,H*0.11)),'#ffe066');return L.numberLine(c,W,H,lo,hi);};

        {t:4,say:'Seven minus four. Start at the smaller number, four.',draw:(c,W,H,k,t,o)=>{const nl=line(c,W,H,0,10,'7 − 4 = ?');c.fillStyle='#5ab0ff';c.beginPath();c.arc(nl.X(4),nl.y,12,0,6.28);c.fill();L.dogAt(c,o.dog,nl.X(4),nl.y-16,ds(W,H));}},
